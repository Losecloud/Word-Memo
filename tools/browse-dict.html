  }

  // ==================== MDX 导入（浏览器端解析） ====================
  const logBox = $('importLog');
  const logStatus = $('importStatus');
  const logActions = $('importActions');

  function ilog(msg, cls) {
    logBox.style.display = 'block';
    logBox.innerHTML += '<div class="' + (cls || '') + '">' + msg + '</div>';
    logBox.scrollTop = logBox.scrollHeight;
  }
  function setStatus(s) { logStatus.textContent = s; }

  // ---- 字节工具 ----
  function adler32(u8) {
    let a = 1, b = 0;
    for (let i = 0; i < u8.length; i++) { a = (a + u8[i]) % 65521; b = (b + a) % 65521; }
    return ((b << 16) | a) >>> 0;
  }
  const viewOf = (u8) => new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const le32 = (u8, o) => viewOf(u8).getUint32(o, true);
  const be32 = (u8, o) => viewOf(u8).getUint32(o, false);
  const be64 = (u8, o) => be32(u8, o) * 4294967296 + be32(u8, o + 4);
  function rd(o, n, u8) {
    if (n === 8) return be64(u8, o);
    if (n === 4) return be32(u8, o);
    if (n === 2) return viewOf(u8).getUint16(o, false);
    return u8[o];
  }
  function decText(u8, isUTF16) {
    return new TextDecoder(isUTF16 ? 'utf-16le' : 'utf-8').decode(u8);
  }
  // 查找分隔符（UTF-8: 0x00；UTF-16: 00 00）
  function findDelim(u8, from, isUTF16) {
    if (!isUTF16) return u8.indexOf(0, from);
    for (let i = from; i < u8.length - 1; i++) if (u8[i] === 0 && u8[i + 1] === 0) return i;
    return -1;
  }
  function concatU8(list) {
    const total = list.reduce((s, c) => s + c.length, 0);
    const out = new Uint8Array(total);
    let p = 0;
    for (const c of list) { out.set(c, p); p += c.length; }
    return out;
  }

  // ---- 解压/解密 ----
  async function inflateZlib(u8) {
    const ds = new DecompressionStream('deflate');
    const stream = new Blob([u8]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  function lzoDecompress(u8, outLen) {
    const out = window.lzo1x.decompress(u8, { initSize: Math.max(outLen || u8.length, 8192), blockSize: 1308672 });
    return new Uint8Array(out.buffer, out.byteOffset, out.byteLength);
  }
  function mdxDecrypt(u8) {
    const seed = new Uint8Array(8);
    seed.set(u8.subarray(4, 8), 0);
    seed[4] = 0x95; seed[5] = 0x36; // little-endian 0x3695
    const key = window.ripemd128(seed);
    const b = u8.slice();
    let prev = 0x36;
    for (let i = 8; i < b.length; i++) {
      const j = i - 8;
      const orig = b[i];
      let t = ((orig >> 4) | (orig << 4)) & 0xff;
      t = (t ^ prev ^ (j & 0xff) ^ key[j % 16]) & 0xff;
      prev = orig;
      b[i] = t;
    }
    return b;
  }
  // 解压单个块（type=0 原始 / 1 LZO / 2 zlib），返回 Uint8Array
  async function decompressBlock(u8, outLen) {
    const type = le32(u8, 0);
    if (type === 0) return u8.subarray(8);
    if (type === 1) return lzoDecompress(u8.subarray(8), outLen);
    if (type === 2) return await inflateZlib(u8.subarray(8));
    throw new Error('未知压缩类型 ' + type);
  }
  function checkAdler(u8, cka, label) {
    if (cka !== adler32(u8)) ilog('  ⚠ ' + label + ' ADLER32 校验不符（忽略，继续）', 'warn');
  }

  // ---- MDX 主解析 ----
  async function parseMDX(buf) { // buf: ArrayBuffer
    const b = new Uint8Array(buf);
    logBox.innerHTML = '';
    logActions.style.display = 'none';

    // 1. 头部
    let o = 0;
    const hlen = be32(b, o); o += 4;
    const hbytes = b.subarray(o, o + hlen); o += hlen;
    o += 4; // adler32
    const htext = decText(hbytes, true).replace(/\u0000+$/, '');
    const attrs = {};
    const re = /(\w+)="(.*?)"/gs;
    let m;
    while ((m = re.exec(htext))) attrs[m[1]] = m[2];
    ilog('■ 头部: ' + htext.replace(/[\r\n]+/g, ' ').slice(0, 160));

    const version = parseFloat(attrs.GeneratedByEngineVersion || '1.2');
    const nw = version >= 2 ? 8 : 4;
    const isUTF16 = (attrs.Encoding || 'UTF-8').toUpperCase() === 'UTF-16';
    const encrypted = attrs.Encrypted && attrs.Encrypted !== 'No' ? parseInt(attrs.Encrypted, 10) || 0 : 0;
    ilog('■ 格式: v' + version + ' / ' + (attrs.Encoding || 'UTF-8') + ' / 加密=' + encrypted + ' / compact=' + attrs.Compact);
    if (encrypted & 1) throw new Error('本词典启用「头部加密」（Encrypted=1），浏览器版暂不支持，请用 node tools/convert-mdx.js 转换');
    if (attrs.Compact !== 'Yes') ilog('  ⚠ Compact=No：词头为完整形式，不影响转换', 'warn');
    if (typeof DecompressionStream !== 'function') throw new Error('当前浏览器不支持 DecompressionStream（请用 Chrome/Edge/Firefox 113+）');

    // 2. key block 区段头部
    let numKeyBlocks, numEntries, kbInfoDecompSize, kbInfoSize, kbSize;
    if (version >= 2) {
      numKeyBlocks = rd(o, nw, b); o += nw;
      numEntries = rd(o, nw, b); o += nw;
      kbInfoDecompSize = rd(o, nw, b); o += nw;
      kbInfoSize = rd(o, nw, b); o += nw;
      kbSize = rd(o, nw, b); o += nw;
      o += 4; // adler32
    } else {
      numKeyBlocks = rd(o, nw, b); o += nw;
      numEntries = rd(o, nw, b); o += nw;
      kbInfoSize = rd(o, nw, b); o += nw;
      kbSize = rd(o, nw, b); o += nw;
    }
    ilog('■ key区: blocks=' + numKeyBlocks + ' entries=' + numEntries + ' kbInfo=' + kbInfoSize + ' kbSize=' + kbSize);

    // 3. key block info
    const kbInfoRaw = b.subarray(o, o + kbInfoSize); o += kbInfoSize;
    let kbInfo;
    if (version >= 2) {
      let raw = kbInfoRaw;
      if (encrypted & 2) { ilog('  … 解密 key-block-info (RIPEMD-128)…'); raw = mdxDecrypt(kbInfoRaw); }
      kbInfo = await decompressBlock(raw, kbInfoDecompSize);
      checkAdler(kbInfo, be32(kbInfoRaw, 4), 'kbInfo');
    } else {
      kbInfo = kbInfoRaw;
    }

    // 4. 解析 block info 列表
    const w = version >= 2 ? 2 : 1;
    const term = version >= 2 ? 1 : 0;
    const mult = isUTF16 ? 2 : 1;
    const blocks = [];
    let i = 0, cnt = 0;
    while (i < kbInfo.length && blocks.length < numKeyBlocks) {
      cnt += rd(i, nw, kbInfo); i += nw;
      const hsz = rd(i, w, kbInfo); i += w;
      i += (hsz + term) * mult;
      const tsz = rd(i, w, kbInfo); i += w;
      i += (tsz + term) * mult;
      const cs = rd(i, nw, kbInfo); i += nw;
      const ds = rd(i, nw, kbInfo); i += nw;
      blocks.push([cs, ds]);
    }
    if (cnt !== numEntries) ilog('  ⚠ 词头总数 ' + cnt + ' ≠ 声明 ' + numEntries, 'warn');
    ilog('  ✓ key block 信息: ' + blocks.length + ' 块');

    // 5. 解压 key blocks → 词头表
    const kbs = b.subarray(o, o + kbSize); o += kbSize;
    const keys = [];
    let kbPos = 0;
    for (let bi = 0; bi < blocks.length; bi++) {
      const [cs, ds] = blocks[bi];
      const blk = kbs.subarray(kbPos, kbPos + cs); kbPos += cs;
      const dec = await decompressBlock(blk, ds);
      checkAdler(dec, be32(blk, 4), 'key块' + bi);
      let p = 0;
      while (p < dec.length) {
        const id = isUTF16 ? viewOf(dec).getUint16(p, true) : rd(p, nw, dec);
        p += nw;
        const di = findDelim(dec, p, isUTF16);
        if (di < 0) break;
        keys.push({ id: id, text: decText(dec.subarray(p, di), isUTF16).replace(/\u0000+$/, '') });
        p = di + (isUTF16 ? 2 : 1);
      }
      if (bi % 50 === 0) { setStatus('解压词头块 ' + (bi + 1) + '/' + blocks.length); await new Promise(r => setTimeout(r, 0)); }
    }
    ilog('  ✓ 词头解析: ' + keys.length + ' 条');

    // 6. record 区
    const numRecordBlocks = rd(o, nw, b); o += nw;
    const numRecordEntries = rd(o, nw, b); o += nw;
    const recInfoSize = rd(o, nw, b); o += nw;
    const recSize = rd(o, nw, b); o += nw;
    const recInfos = [];
    for (let k = 0; k < numRecordBlocks; k++) {
      recInfos.push([rd(o, nw, b), rd(o, nw, b)]); o += nw * 2;
    }
    ilog('■ 记录区: blocks=' + numRecordBlocks + ' entries=' + numRecordEntries + ' recSize=' + recSize);

    // 7. 解压全部 record 块并拼接
    const recStart = o;
    const chunks = [];
    let recPos = 0;
    for (let bi = 0; bi < recInfos.length; bi++) {
      const [cs, ds] = recInfos[bi];
      const blk = b.subarray(recStart + recPos, recStart + recPos + cs); recPos += cs;
      chunks.push(await decompressBlock(blk, ds));
      if (bi % 300 === 0) { setStatus('解压记录块 ' + (bi + 1) + '/' + recInfos.length); await new Promise(r => setTimeout(r, 0)); }
    }
    const recData = concatU8(chunks);
    ilog('  ✓ 记录区解压完成: ' + (recData.length / 1048576).toFixed(1) + ' MB');

    // 8. 按 id 切片组装词典
    const dict = {};
    let skipped = 0;
    for (let ki = 0; ki < keys.length; ki++) {
      const k = keys[ki];
      if (k.id >= recData.length) { skipped++; continue; }
      const end = ki + 1 < keys.length ? keys[ki + 1].id : recData.length;
      if (end > recData.length) { skipped++; continue; }
      let text = decText(recData.subarray(k.id, end), false);
      text = text.replace(/\u0000+$/, '');
      if (text) dict[k.text] = text; else skipped++;
    }
    if (skipped) ilog('  ⚠ 跳过无效/越界条目: ' + skipped, 'warn');
    ilog('  ✓ 转换完成: ' + Object.keys(dict).length + ' 个词条');
    return { dict, name: attrs.Title || 'unnamed' };
  }

  // ---- 导入流程 ----
  function pickMdxFile() {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.mdx';
      input.onchange = () => resolve(input.files && input.files[0]);
      input.click();
    });
  }
  async function importMdx() {
    // 显示导入状态栏（含日志与「保存到 data 目录」按钮）
    const bar = $('importBar');
    if (bar) bar.style.display = 'block';
    setStatus('选择文件…');
    const file = await pickMdxFile();
    if (!file) { setStatus('已取消'); return; }
    const baseName = file.name.replace(/\.mdx$/i, '');
    logActions.style.display = 'none';
    ilog('▶ 导入: ' + file.name + ' (' + (file.size / 1048576).toFixed(1) + ' MB)');
    setStatus('解析中…');
    try {
      const buf = await file.arrayBuffer();
      const { dict, name } = await parseMDX(buf);
      // 词库变量名：保留 Unicode 字母/数字（含中文），其余字符归一为下划线，避免纯中文名被清空导致碰撞
      const varName = baseName.replace(/[^\p{L}\p{N}_-]/gu, '_').replace(/_+/g, '_').replace(/^_|_$/g, '').toUpperCase() + '_DICT';
      const jsText = '// 由 MDX 浏览器端导入: ' + file.name + '\n// 转换时间: ' + new Date().toISOString() + '\nvar ' + varName + ' = ' + JSON.stringify(dict) + ';\n';

      // 立即加载进当前页面
      window.eval(jsText);
      const { redirects, normal } = buildRedirects(window[varName]);
      const d = DICTS[varName] || {};
      d.name = name || baseName;
      d.data = window[varName];
      d.count = normal;
      d.redirects = redirects;
      d.enabled = true;
      d.mdd = null;
      DICTS[varName] = d;
      // 同步启用状态
      let arr = getEnabledDicts();
      if (!arr.includes(varName)) { arr.push(varName); setEnabledDicts(arr); }
      ilog('  ✓ 已加载到当前页面（可立即浏览）');
      finishLoad();
      switchDict(varName);

      logActions.style.display = 'flex';
      logActions.innerHTML =
        '<button id="saveDictBtn" class="primary">💾 保存到 data 目录（生成 ' + varName.replace(/_DICT$/i, '').toLowerCase() + '-dict.js）</button>' +
        '<button id="skipSaveBtn">仅本次浏览，不保存</button>';
      $('saveDictBtn').onclick = () => saveDictToData(jsText, baseName, varName);
      $('skipSaveBtn').onclick = () => { logActions.style.display = 'none'; setStatus('已载入（未保存）'); };
      setStatus('转换成功 ✓');
    } catch (e) {
      ilog('✗ 转换失败: ' + e.message, 'err');
      ilog('  troubleshooting: 请确认文件是标准 MDX；或改用 node tools/convert-mdx.js 转换；若为加密词典请查看上方格式信息', 'warn');
      setStatus('失败 ✗');
    }
  }

  // 保存词典 JS 到 data 目录并更新清单（File System Access API）
  // 保存方式分两级：
  //   1. 优先经本地服务 tools/serve.js 的 POST /save-dict 直接写入项目 data/ 目录（确定性落盘）
  //   2. 服务不可用时，回退浏览器目录选择器（用户需手动选到项目 data 文件夹）
  function serverBase() {
    // served 模式：同源；file:// 模式：尝试默认端口 8377（tools/serve.js）
    return /^https?:$/.test(location.protocol) ? location.origin : 'http://localhost:8377';
  }
  async function saveViaServer(jsText, varName) {
    const resp = await fetch(serverBase() + '/save-dict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ varName: varName, content: jsText })
    });
    const data = await resp.json().catch(() => ({ ok: false, error: '响应解析失败' }));
    if (!data.ok) throw new Error(data.error || ('HTTP ' + resp.status));
    return data;
  }

  async function saveDictToData(jsText, baseName, varName) {
    const fname = varName.replace(/_DICT$/i, '').toLowerCase() + '-dict.js';
    // 保存成功后的收尾：更新内存 meta、持久化清单 dictMetas、刷新下拉/状态
    const applySaved = () => {
      const d = DICTS[varName];
      const displayName = d ? d.name : baseName;
      if (d) d.meta = { varName, name: displayName, url: '../data/' + fname, text: null, size: 0, mdd: null };
      upsertSavedMeta({ varName: varName, name: displayName, file: fname, mdd: null, size: 0 });
      broadcastPickerState();
      logActions.style.display = 'none';
      setStatus('保存完成 ✓（已写入 data/ 目录，下次打开自动加载）');
    };

    // 方式 1：本地服务写入 data/（无需用户选目录）
    try {
      setStatus('保存到 data/ 目录…');
      const r = await saveViaServer(jsText, varName);
      ilog('  ✓ 已保存到 data/：' + r.file, 'ok');
      ilog('  ✓ 已更新清单 dict-manifest.js（' + r.count + ' 本词典）', 'ok');
      applySaved();
      return;
    } catch (e) {
      ilog('  本地服务不可用（' + e.message + '），改为目录选择方式…', 'warn');
    }

    // 方式 2：File System Access API 手动选择目录
    try {
      if (!window.showDirectoryPicker) { ilog('✗ 当前浏览器不支持 showDirectoryPicker，请用 Chrome/Edge，或启动本地服务 tools/serve.js', 'err'); return; }
      setStatus('选择保存目录…（请务必选择项目 data 文件夹）');
      const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
      const fh = await dir.getFileHandle(fname, { create: true });
      const w = await fh.createWritable();
      await w.write(jsText);
      await w.close();
      ilog('  ✓ 已保存: ' + fname, 'ok');

      // 更新 dict-manifest.js（重新扫描该目录下所有 *-dict.js）
      setStatus('更新清单…');
      const manifest = [];
      for await (const entry of dir.values()) {
        if (entry.kind !== 'file' || !/^.+?-dict\.js$/i.test(entry.name) || entry.name === 'dict-manifest.js') continue;
        const f = await entry.getFile();
        const head = (await f.text()).slice(0, 4096);
        const mv = /var\s+([\p{L}_$][\p{L}\p{N}_$]*)\s*=\s*\{/u.exec(head);
        if (mv) manifest.push({ file: entry.name, name: entry.name.replace(/-dict\.js$/i, ''), varName: mv[1] });
      }
      manifest.sort((a, b) => a.name.localeCompare(b.name));
      const mh = await dir.getFileHandle('dict-manifest.js', { create: true });
      const mw = await mh.createWritable();
      await mw.write('// 自动生成：浏览器导入或 tools/convert-mdx.js 更新，请勿手改\nvar DICT_MANIFEST = ' + JSON.stringify(manifest, null, 1) + ';\n');
      await mw.close();
      ilog('  ✓ 已更新清单 dict-manifest.js（' + manifest.length + ' 本词典）', 'ok');
      applySaved();
    } catch (e) {
      ilog('✗ 保存失败: ' + e.message, 'err');
      ilog('  已加载到当前页面；可将 JS 文件手动放入 data/ 目录后刷新', 'warn');
      setStatus('未保存（仅本次浏览）');
    }
  }

  $('importBtn').onclick = importMdx;
  $('scan').onclick = doScan;
  $('reload').onclick = () => location.reload();
  // 即时检索：输入/删减立即刷新列表（IME 组合期间不触发，候选上屏后刷新）
  const searchBox = $('search');
  let composing = false;
  searchBox.addEventListener('compositionstart', () => { composing = true; });
  searchBox.addEventListener('compositionend', () => { composing = false; refresh(); });
  searchBox.addEventListener('input', () => { if (!composing) refresh(); });

  // 自动展开：输入停顿 500ms 或按下 Enter，若只有一个匹配项则直接展开；多个则展开第一个。
  // 无精准匹配时走模糊匹配（与列表显示一致），展开最接近的词。
  let autoShowTimer = 0;
  function autoShowBestMatch(q) {
    let matches = q ? prefixRange(keys, q) : [];
    if (!matches.length && q) matches = fuzzyMatch(q).map(x => x.w);
    if (matches.length === 1) {
      showDetail(matches[0]);
    } else if (matches.length > 1) {
      showDetail(matches[0]); // 展开第一个（精准前缀最短 / 模糊最接近）
    }
  }
  function debouncedAutoShow(q) {
    clearTimeout(autoShowTimer);
    autoShowTimer = setTimeout(() => autoShowBestMatch(q), 500);
  }
  searchBox.addEventListener('input', () => {
    if (composing || LOOKUP) return;
    debouncedAutoShow($('search').value.trim().toLowerCase());
  });

  // 回车：立即展开最佳匹配；若输入词恰是重定向索引（@@@LINK=），跳转到目标词条
  searchBox.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' || !cur || LOOKUP) return;
    const q = $('search').value.trim().toLowerCase();
    const r = DICTS[cur].redirects || {};
    if (r[q] && !DICTS[cur].data[q]) {
      ev.preventDefault();
      showDetail(q);
      refresh();
      return;
    }
    // 非重定向：展开最佳匹配
    ev.preventDefault();
    autoShowBestMatch(q);
  });
  $('prev').onclick = () => { if (page > 0) { page--; render(); } };
  $('next').onclick = () => { page++; render(); };

  // ==================== 查询模式桥接（主页 iframe 复用检索功能） ====================
  function post(obj) {
    try { window.parent.postMessage(Object.assign({ __dictLookup: 1 }, obj), '*'); } catch (e) { /* 忽略 */ }
  }
  // 词库下拉状态快照（单一数据源）：主页设置页渲染同一套下拉，仅做展示与转发命令
  // preferred 以用户首选词典（browseDictCur）为准，cur 仅兜底：引擎当前词典可能因临时查看其他词典而变
  function pickerState() {
    let pref = null;
    try { pref = localStorage.getItem('browseDictCur'); } catch (e) { /* 忽略 */ }
    return {
      preferred: pref || cur,
      list: Object.keys(DICTS)
        .filter(v => DICTS[v].name)
        .map(v => ({ varName: v, name: DICTS[v].name, enabled: !!DICTS[v].enabled }))
    };
  }
  function broadcastPickerState() {
    if (!LOOKUP) return;
    post({ type: 'picker-state', state: pickerState() });
  }
  // 按词典构建排序 key（复用 switchDict 的缓存策略）
  function sortedKeysOf(d) {
    if (!d.sortedKeys) {
      const r = d.redirects || {};
      d.sortedKeys = Object.keys(d.data).filter(k => !r[k]).sort();
    }
    return d.sortedKeys;
  }
  // 单词典内模糊匹配（与 fuzzyMatch 同算法，接受指定 key 集）
  function fuzzyIn(d, q, max) {
    const sorted = sortedKeysOf(d);
    if (q.length < 2) return [];
    let cand = prefixRange(sorted, q.slice(0, 2));
    if (cand.length < 30) cand = prefixRange(sorted, q[0]);
    const lenLo = Math.max(1, q.length - 2), lenHi = q.length + 2;
    const scored = [];
    for (const w of cand) {
      const lw = w.length;
      if (lw < lenLo || lw > lenHi) continue;
      scored.push({ w, d: editDistance(q, w) });
      if (scored.length > 3000) break; // 防极端
    }
    scored.sort((a, b) => a.d - b.d || a.w.length - b.w.length);
    return scored.slice(0, max).map(x => x.w);
  }
  // 首选词典（browseDictCur）：检索与最近查词时排在最前，保证其释义优先展示
  function preferredOrder() {
    let prio = null;
    try { prio = localStorage.getItem('browseDictCur'); } catch (e) { /* 忽略 */ }
    return Object.keys(DICTS).sort((a, b) => {
      if (a === prio) return -1;
      if (b === prio) return 1;
      return 0;
    });
  }
  // 跨已启用词典检索：精准前缀优先，无精准则模糊；结果去重
  function lookupSearch(q) {
    q = (q || '').trim().toLowerCase();
    let pref = null;
    try { pref = localStorage.getItem('browseDictCur'); } catch (e) { /* 忽略 */ }
    const exact = [], fuzzy = [];
    const seen = new Set();
    const push = (arr, w, v, d, isFuzzy) => {
      const target = resolveRedirect(v, w);
      const k = v + '\u0001' + target;
      if (seen.has(k)) return;
      seen.add(k);
      const html = d.data[target] != null ? d.data[target] : d.data[w];
      // 首选词典精确命中该词：preview 展示更多内容（约三行），并打标供主页多行渲染
      const preferredHit = !isFuzzy && v === pref && target === q;
      arr.push({ w: target, dict: v, dictName: d.name, preview: toText(html).slice(0, preferredHit ? 380 : 110), fuzzy: isFuzzy, preferred: preferredHit });
    };
    for (const v of preferredOrder()) {
      const d = DICTS[v];
      if (!d.enabled || !d.data) continue;
      if (q) {
        const ex = prefixRange(sortedKeysOf(d), q);
        const cap = 60 - exact.length;
        for (let i = 0; i < ex.length && i < cap; i++) push(exact, ex[i], v, d, false);
        if (!ex.length) {
          const fz = fuzzyIn(d, q, 4);
          for (const w of fz) push(fuzzy, w, v, d, true);
        }
      }
      if (exact.length >= 60) break;
    }
    // 上报是否有已启用的导入词典：供主页判断是否需要用基础词典兜底
    let hasDicts = false;
    for (const v of Object.keys(DICTS)) {
      if (DICTS[v].enabled && DICTS[v].data) { hasDicts = true; break; }
    }
    post({ type: 'search-res', q, words: exact.concat(fuzzy).slice(0, 60), hasDicts });
  }
  // 最近查词（复用 localStorage recentWords，仅保留当前已启用词库中有释义的词）
  function lookupRecent() {
    const words = [];
    const seen = new Set();
    try {
      const recent = JSON.parse(localStorage.getItem('recentWords') || '[]');
      for (const w of recent) {
        if (seen.has(w)) continue;
        for (const v of preferredOrder()) {
          const d = DICTS[v];
          if (d.enabled && d.data && d.data[w] != null) {
            seen.add(w);
            words.push({ w, dict: v, dictName: d.name, preview: toText(d.data[w]).slice(0, 110), fuzzy: false });
            break;
          }
        }
        if (words.length >= 50) break;
      }
    } catch (e) { /* 忽略 */ }
    post({ type: 'search-res', q: '', words });
  }

  // 清洗例句：去除中文、特殊符号、多余空白，保留英文句
  function cleanExampleText(text) {
    if (!text) return '';
    let s = String(text)
      // 去除中文
      .replace(/[\u4e00-\u9fff\u3400-\u4dbf\uff00-\uffef\u3000-\u303f]+/g, '')
      // 去除特殊符号 @ # $ % ^ * _ ~ = + < > [ ] { } | \ / 
      .replace(/[@#$%^*_~=+<>[\]{}|\\/]/g, '')
      // 去除多余空格，保留句尾标点
      .replace(/\s+/g, ' ')
      .trim();
    // 去掉首尾的标点（如 , . - : ; ）
    s = s.replace(/^[\s,.\-:;!?]+/, '').replace(/[\s,.\-:;!?]+$/, '');
    // 如果去掉中文后太短（< 5 个英文字符），说明例句主要就是中文，放弃
    if (s.replace(/[^a-zA-Z']/g, '').length < 5) return '';
    // 补齐句号
    if (s && !/[.!?]$/.test(s)) s += '.';
    return s;
  }

  // 跨词典搜索单词的第一个例句，返回 { text, dictName }
  function extractExampleFromDicts(word) {
    const w = String(word).toLowerCase().trim();
    if (!w) return { text: '', dictName: '' };
    // 按首选词典顺序：先当前首选，再遍历其他已启用词典
    const dicts = Object.keys(DICTS).filter(v => DICTS[v].enabled && DICTS[v].data);
    // 把当前首选词典排到最前
    const curIdx = dicts.indexOf(cur);
    if (curIdx > 0) { dicts.splice(curIdx, 1); dicts.unshift(cur); }

    for (let di = 0; di < dicts.length; di++) {
      const v = dicts[di];
      const d = DICTS[v];
      const target = resolveRedirect(v, w);
      const html = d.data[target] != null ? d.data[target] : d.data[w];
      if (html == null) continue;
      const example = extractExampleFromHtml(html, w);
      if (example) return { text: example, dictName: d.name || v };
    }
    return { text: '', dictName: '' };
  }

  // 从词典 HTML 中提取第一个例句
  function extractExampleFromHtml(html, word) {
    if (!html) return '';
    // 先剥离 head/style/script/link 等非内容区域，避免误匹配
    let text = String(html)
      .replace(/<head[\s>][\s\S]*?<\/head>/gi, '')
      .replace(/<style[\s>][\s\S]*?<\/style>/gi, '')
      .replace(/<script[\s>][\s\S]*?<\/script>/gi, '')
      .replace(/<link\b[^>]*\/?>/gi, '');
    // 常见例句标签/类名模式（优先匹配，取内含标签剥离后的纯文本）
    const patterns = [
      // OALD / 牛津系列：<span class="x">例句</span>（内部可能含 <xt> 等子标签）
      { re: /<span[^>]*class\s*=\s*["'][^"']*\b(?:x|eg|example|exampl|ex)\b[^"']*["'][^>]*>([\s\S]*?)<\/span>/i, inner: true },
      // Collins: <div class="example"> 或 <span class="quote">
      { re: /<div[^>]*class\s*=\s*["'][^"']*\b(?:example|cit|quote)\b[^"']*["'][^>]*>([\s\S]*?)<\/div>/i, inner: true },
      // 通用：<example> 标签
      { re: /<example[^>]*>([\s\S]*?)<\/example>/i, inner: true },
      // 通用：<eg> 标签
      { re: /<eg[^>]*>([\s\S]*?)<\/eg>/i, inner: true },
    ];
    for (let i = 0; i < patterns.length; i++) {
      const m = patterns[i].re.exec(text);
      if (m && m[1]) {
        let ex = m[1].replace(/<[^>]+>/g, '').replace(/&nbsp;/gi, ' ').replace(/\s+/g, ' ').trim();
        if (ex.length >= 5) return cleanExampleText(ex);
      }
    }
    // 兜底：引号包围的例句
    const quotePatterns = [
      /[""""'']([^"''""']{10,})["""''']/,
      /[「『]([^」』]{8,})[」』]/
    ];
    for (let i = 0; i < quotePatterns.length; i++) {
      const m = quotePatterns[i].exec(text);
      if (m && m[1]) {
        const ex = m[1].replace(/<[^>]+>/g, '').replace(/&nbsp;/gi, ' ').replace(/\s+/g, ' ').trim();
        if (ex.length >= 8 && ex.length <= 300 && ex.toLowerCase().includes(word.toLowerCase())) return cleanExampleText(ex);
      }
    }
    // 最后兜底：取包含该单词的、长度在 8~200 之间的第一个纯文本句
    const sentences = text.replace(/<[^>]+>/g, '\n').split(/[.。!！?？\n]+/);
    for (let s = 0; s < sentences.length; s++) {
      const st = sentences[s].replace(/&nbsp;/gi, ' ').replace(/\s+/g, ' ').trim();
      if (st.length >= 8 && st.length <= 200 && st.toLowerCase().includes(word.toLowerCase())) return cleanExampleText(st);
    }
    return '';
  }

  function lookupOpen(w, q, dict, base, favorited, cands) {
    $('search').value = q || '';
    // 词条可能来自其他已启用词典：先切到该词典，确保释义按其渲染
    if (dict && DICTS[dict] && DICTS[dict].enabled && DICTS[dict].data) {
      const d = DICTS[dict];
      const target = resolveRedirect(dict, w);
      const has = d.data[target] != null || d.data[w] != null;
      if (has && cur !== dict) {
        // 打开其他词典词条仅为临时查看：先记下用户首选词典，切换后恢复，
        // 避免"首选查词词典"被本次查看的词典覆盖（如看完 Collins 后首选变 Collins）
        let savedPref = null;
        try { savedPref = localStorage.getItem('browseDictCur'); } catch (e) { /* 忽略 */ }
        switchDict(dict);
        if (savedPref) {
          try { localStorage.setItem('browseDictCur', savedPref); } catch (e) { /* 忽略 */ }
        }
        broadcastPickerState(); // 校正广播：preferred 以用户首选（browseDictCur）为准
      }
    }
    showDetail(w, base, favorited, cands);
    // 渲染完成：报告内容高度，供主页按内容撑开 iframe（图片等异步资源加载后高度会变化，主页会复测）
    const detailBox = $('detail');
    post({ type: 'opened', w, height: detailBox ? detailBox.scrollHeight || 0 : 0 });
  }
  if (LOOKUP) {
    window.addEventListener('message', (ev) => {
      const d = ev.data || {};
      if (d.__dictLookup !== 1) return;
      if (d.cmd === 'search') lookupSearch(d.q);
      else if (d.cmd === 'recent') lookupRecent();
      else if (d.cmd === 'open') lookupOpen(d.w, d.q || '', d.dict, d.base, d.favorited, d.cands);
      else if (d.cmd === 'lookup-example') {
        // 查询单词的第一个例句（跨词典搜索），返回 { word, example, dictName }
        const word = d.word;
        if (!word) { post({ type: 'example-result', word: '', example: '' }); return; }
        const example = extractExampleFromDicts(word);
        post({ type: 'example-result', word, example: example.text, dictName: example.dictName });
      }
      else if (d.cmd === 'close') doCollapseDetail();
      else if (d.cmd === 'get-state') post({ type: 'picker-state', state: pickerState() });
      else if (d.cmd === 'hello') {
        // 握手应答：主页监听可能晚于引擎首次 ready 注册，收到 hello 时补发一次 ready/状态
        if (lookupReady) { post({ type: 'ready' }); broadcastPickerState(); }
      }
      else if (d.cmd === 'set-enabled') setDictEnabled(d.varName, !!d.enable);
      else if (d.cmd === 'set-preferred') {
        // 设为首选查词词典：切换到该词典（若未加载完成 switchDict 内部会先加载）
        if (DICTS[d.varName] && DICTS[d.varName].enabled) switchDict(d.varName);
      }
      else if (d.cmd === 'set-name') {
        // 重命名词库（来自主页或本页）：引擎统一处理内存/持久化并广播
        if (DICTS[d.varName] && d.name) saveDictName(d.varName, d.name);
      }
      else if (d.cmd === 'set-theme') {
        // 主题类同时挂 body 与 html：body 控制内容配色，html 让 root scroller 滚动条也随主题切换
        const dark = !!d.dark;
        document.body.classList.toggle('dark-mode', dark);
        document.documentElement.classList.toggle('dark-mode', dark);
      }
    });
  }

  init().then(() => { if (LOOKUP) { lookupReady = true; post({ type: 'ready' }); broadcastPickerState(); } });
})();
</script>
</body>
</html>
