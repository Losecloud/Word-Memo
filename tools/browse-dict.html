<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>词忆 - 词典数据浏览</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; }
  /* 查询模式（主页嵌入 iframe ?mode=lookup）：仅显示词条详情 */
  body.lookup-mode header { display: none; }
  body.lookup-mode main { padding: 0; max-width: none; }
  body.lookup-mode #loading, body.lookup-mode #list, body.lookup-mode #pager, body.lookup-mode .import-bar { display: none !important; }
  body.lookup-mode #detail { border-radius: 0; box-shadow: none; }
  /* 移动端风格细滚动条（全局，含 iframe 内 root scroller）：深浅配色走 CSS 变量，
     dark-mode 类同时挂在 html 上（见 set-theme 消息处理），滚动条随主题切换 */
  :root { --dl-scroll-thumb: rgba(120,120,128,0.35); --dl-scroll-thumb-hover: rgba(120,120,128,0.55); }
  :root.dark-mode { --dl-scroll-thumb: rgba(255,255,255,0.28); --dl-scroll-thumb-hover: rgba(255,255,255,0.45); }
  html { scrollbar-width: thin; scrollbar-color: var(--dl-scroll-thumb) transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--dl-scroll-thumb); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dl-scroll-thumb-hover); }
  /* 深色模式（主页 ?mode=lookup 时通过 set-theme 同步，色板对齐主页面 dark 主题） */
  body.dark-mode { background: #1e2126; }
  body.dark-mode #detail { background: #282c34; color: #e0e0e0; }
  body.dark-mode .detail-head:hover { background: #33383f; }
  body.dark-mode .detail-head .collapse-icon { color: #a0a0a0;  }

  body.dark-mode .raw { color: #c9ccd1; }
  body.dark-mode .redirect-note { color: #a0a0a0; background: #33383f; }
  body.dark-mode .fuzzy-hint { color: #e5a13b; }
  body.dark-mode .collins-html { color: #e0e0e0; }
  body.dark-mode .collins-html a { color: #7db3f0; }
  body.dark-mode .collins-html a:hover { text-decoration: underline; }
  /* oaldpe 词条深色适配：oaldpe.css 自带的 dark 变量色板（.oaldpe[data-theme='dark']）需要 root 带 data-theme 才生效，
     这里在 iframe 深色模式（body.dark-mode）下直接覆盖其 CSS 变量与少量硬编码浅色，保证 .def/.examples/.labels 等浅灰字体可读 */
  body.dark-mode .oaldpe {
    --grey-0: #222;
    --grey-1: #21252b;
    --grey-2: #363636;
    --grey-3: #444;
    --grey-4: #666;
    --grey-5: #aaa;
    --grey-6: #ccc;
    --grey-7: #ddd;
    --grey-8: #eee;
    --grey-9: #f7f7f7;
    --text-color: var(--grey-6);
    --text-grey-color: var(--grey-5);
    --color-red: #e9546b;
    --color-blue: #1681c2;
    --color-green: #4db6ac;
    --color-orange: #e0a34b;
    --background-color: rgb(255 255 255 / 7%);
    --border-color: rgb(120 170 255 / 35%);
    --border-color-light: rgb(120 170 255 / 60%);
    --background-highlight: linear-gradient(rgb(150 190 255 / 0%) 55%, rgb(150 190 255 / 15%) 55%, rgb(150 190 255 / 15%) 100%);
  }
  body.dark-mode .oaldpe ::selection { background-color: #1e2631; }
  body.dark-mode .oaldpe .labels { color: var(--color-red); }
  body.dark-mode .oaldpe .idm { color: var(--color-blue); }
  /* oaldpe 硬编码的浅绿标题背景 → 深色化 */
  body.dark-mode .oaldpe .entry > .top-container::before {
    background-color: #26372c;
    border-color: #3d5a44;
  }
  body.dark-mode .oaldpe .entry > .top-container .webtop {
    border-color: #3d5a44;
    box-shadow: 0 4px 8px rgba(0, 0, 0, .4);
  }
  /* oaldpe 词性导航（oaldpe-nav）深色化：浅绿底 → 深绿，标签文字提亮 */
  body.dark-mode .oaldpe .oaldpe-nav {
    background-color: #26372c;
    border-color: #3d5a44;
  }
  body.dark-mode .oaldpe .oaldpe-nav span {
    border-color: #3d5a44;
    background-color: #3d5a44;
    color: #a8d5b0;
  }
  body.dark-mode .oaldpe .oaldpe-nav span.active,
  body.dark-mode .oaldpe .oaldpe-nav span:hover {
    background-color: #4b8b45;
    color: #ffffff;
  }
  /* 释义中文翻译底色：浅绿高亮 → 深色淡绿 */
  body.dark-mode .oaldpe deft chn,
  body.dark-mode .oaldpe dtxtx chn {
    background: rgb(77 182 172 / 22%);
  }
  header { position: sticky; top: 0; background: #fff; padding: 10px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); z-index: 9; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  header input { flex: 1; min-width: 200px; padding: 8px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
  #dictSelect { padding: 7px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; min-width: 180px; max-width: 320px; }
  .meta { font-size: 12px; color: #888; }
  main { padding: 16px; max-width: 960px; margin: 0 auto; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { background: #fff; border-radius: 8px; padding: 10px 14px; margin: 5px 0; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  #list li:hover { background: #eef3ff; }
  .w { font-weight: 600; font-size: 16px; }
  .fuzzy-hint { font-size: 12px; color: #e58e26; font-weight: 500; margin-left: 8px; }
  .preview { color: #555; font-size: 13px; margin-top: 4px; max-height: 3.2em; overflow: hidden; white-space: pre-wrap; }
  #detail { background: #fff; border-radius: 8px; padding: 16px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  #detail h2 { margin: 0 0 10px; }
  .detail-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 4px 8px; margin-left: -8px; margin-right: -8px; border-radius: 6px; cursor: pointer; transition: background 0.15s ease; }
  .detail-head:hover { background: #f1f2f4; }
  /* h2 不铺满整行，留出右侧空白区域供点击折叠；超长省略 */
  .detail-head h2 { margin: 0; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 折叠提示 icon：仅悬浮时显示 */
  .detail-head .collapse-icon { flex-shrink: 0; margin-left: auto; margin-right: 5px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; background: transparent;  opacity: 0; transition: opacity 0.15s ease; }
  .detail-head .collapse-icon svg { width: 26px; height: 26px; display: block; }
  .detail-head:hover .collapse-icon { opacity: 1; }
  /* 收藏星标按钮：常态化显示，在 h2 和 collapse-icon 之间 */
  .detail-fav-star { margin-left: 8px; font-size: 18px; cursor: pointer; user-select: none; display: inline-flex; vertical-align: middle; line-height: 1; transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease; }
  .detail-fav-star:hover { transform: scale(1.2) rotate(15deg); }
  /* 未收藏：复用主页 favorite-gray 的灰度+半透明效果；已收藏：原色金色 */
  .detail-fav-star .favorite-icon { filter: grayscale(100%); opacity: 0.35; transition: all 0.2s ease; }
  .detail-fav-star:hover .favorite-icon { opacity: 0.6; }
  .detail-fav-star.favorited .favorite-icon { filter: grayscale(0%); opacity: 1; }
  .raw { font-size: 13px; color: #444; white-space: pre-wrap; word-break: break-word; }
  #pager { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 14px 0; }
  #pager button { padding: 6px 16px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; background: #fff; }
  #pager button:disabled { opacity: .4; cursor: default; }
  .collins-html img { max-width: 100%; }
  /* 词条排版兜底：词典 css 未覆盖时保证可读性 */
  .collins-html { line-height: 1.65; font-size: 14px; color: #222; word-break: break-word; }
  .collins-html a { color: #0b57d0; text-decoration: none; }
  .collins-html a:hover { text-decoration: underline; }
  .collins-html h-g, .collins-html hkey, .collins-html h { display: block; }
  .collins-html top-g { display: block; clear: left; }
  .collins-html pron-g-blk { display: inline; }
  .collins-html .cixing_part { display: block; }
  .collins-html audio-gb, .collins-html symbol[type=key] { cursor: pointer; }
  .collins-html def, .collins-html d { display: block; }
  .collins-html .collins-html p, .collins-html div { margin-bottom: 4px; }
  /* ===== Collins 柯林斯词典词条美化（.tab_content / #dict_tab_101） ===== */
  .collins-html .tab_content { display: block; }
  .collins-html .part_main + .part_main { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e2e4e9; }
  .collins-html .collins_content + .collins_content { margin-top: 10px; }
  .collins-html .caption { line-height: 1.75; margin: 20px 0 6px; }
  /* 英文释义行（重排后置顶、独立成行） */
  .collins-html .caption > .collins-def { display: block; margin: 0 0 1px; }
  /* 义项序号：主题青色加粗（英文释义行前侧的复制序号同样生效） */
  .collins-html .caption > .num, .collins-html .collins-def > .num { color: #4a9d9a; font-weight: 700; margin-right: 4px; }
  /* 词性缩写徽标（N-COUNT→n.[C] 等，由 JS 缩写后填入） */
  .collins-html .st {
    display: inline-block; vertical-align: 1px;
    font-size: 0.72rem; font-weight: 700; line-height: 1.5;
    color: #fff; background: #4a9d9a;
    border-radius: 4px; padding: 0 6px; margin-right: 6px;
    letter-spacing: .3px;
  }
  /* 中文释义与例句中的主词：主题青色 */
  .collins-html .text_blue { color: #4a9d9a; }
  /* 例句列表 */
  .collins-html .tab_content ul { margin: 6px 0 0; padding-left: 18px; }
  .collins-html .tab_content li { margin: 4px 0; }
  .collins-html .tab_content li > p { margin: 1px 0; }
  /* 例句译文弱化 */
  .collins-html .tab_content li > p + p { color: #7a7f87; }
  /* 搭配/语法框（【搭配模式】等）：每条原本为 <div><br>文本</div>，<br> 会在块首多出一个空行导致间隔过大，
     隐藏该 <br> 并收紧嵌套行距，恢复为每行一条的合理间距 */
  .collins-html .tab_content [id^="word_gram_"] { font-size: 0.8rem; color: #8a8f98; line-height: 1.5; }
  .collins-html .tab_content [id^="word_gram_"] br { display: none; }
  .collins-html .tab_content [id^="word_gram_"] div { margin-bottom: 0; }
  /* 派生词等补充块 */
  .collins-html .vExplain_r { margin-top: 8px; padding: 8px 10px; background: #f6f8f9; border-radius: 6px; }
  /* 语音/变体说明块（in AM, use ... / 读音说明）：底部细灰分隔线 */
  .collins-html .vExplain_s { padding-bottom: 8px; border-bottom: 1px solid #e8eaee; }
  /* 查询主词高亮：主题青色 + 加粗 + 同色下划线 */
  .collins-html .collins-hl {
    color: #4a9d9a; font-weight: 700;
    text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 2px;
  }
  /* 深色模式适配 */
  body.dark-mode .collins-html .part_main + .part_main { border-top-color: #3a3f4b; }
  body.dark-mode .collins-html .caption > .num { color: #5fb3af; }
  body.dark-mode .collins-html .st { background: #3d7b78; color: #eafaf9; }
  body.dark-mode .collins-html .text_blue { color: #5fb3af; }
  body.dark-mode .collins-html .tab_content li > p + p { color: #9aa0a8; }
  body.dark-mode .collins-html .tab_content [id^="word_gram_"] { color: #8a9099; }
  body.dark-mode .collins-html .vExplain_r { background: #2b3037; }
  body.dark-mode .collins-html .vExplain_s { border-bottom-color: #33383f; }
  body.dark-mode .collins-html .collins-hl { color: #5fb3af; text-decoration-color: #5fb3af; }
  .redirect-note { font-size: 12px; color: #888; background: #f5f5f5; padding: 4px 10px; border-radius: 4px; margin: 6px 0; }
  /* 基础词典补充信息块（形近词等非本词典词条在"查不到"提示下方展示） */
  .base-dict { margin-top: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-radius: 8px; background: #f8f9fb; }
  .base-dict-title { font-size: 11px; font-weight: 600; color: #888; margin-bottom: 4px; }
  .base-dict-phonetic { font-size: 13px; color: #b0623a; margin-bottom: 4px; }
  .base-dict-meaning { font-size: 13px; color: #444; white-space: pre-wrap; word-break: break-word; }
  body.dark-mode .base-dict { background: #262a33; border-color: #33383f; }
  body.dark-mode .base-dict-title { color: #a0a0a0; }
  body.dark-mode .base-dict-meaning { color: #c9ccd1; }
  /* 基础词典场景类别分级标签 */
  .base-dict-cat { display: inline-block; font-size: 0.72rem; padding: 1px 7px; border-radius: 8px; white-space: nowrap; }
  .base-dict-cat-base { color: #888; background: #ececed; }
  .base-dict-cat-last { color: #1a73e8; background: #e8f0fe; font-weight: 600; }
  body.dark-mode .base-dict-cat-base { color: #b0b0b0; background: #3a3f4b; }
  body.dark-mode .base-dict-cat-last { color: #82b1ff; background: #1a2a3a; }
  #loading { padding: 40px; text-align: center; color: #888; }
  #reload { font-size: 12px; color: #2563eb; cursor: pointer; border: none; background: none; padding: 2px 6px; }
  #scan { font-size: 12px; color: #16a34a; cursor: pointer; border: 1px solid #16a34a; background: none; border-radius: 6px; padding: 2px 8px; }
  #importBtn { font-size: 13px; color: #fff; cursor: pointer; border: none; background: #2563eb; border-radius: 6px; padding: 8px 18px; font-weight: 600; }
  #importBtn:disabled { opacity: .5; cursor: default; }
  .import-bar { background: #fff; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .import-bar h3 { margin: 0 0 10px; font-size: 15px; }
  #importStatus { font-size: 13px; color: #555; margin-left: 10px; }
  #importLog { margin-top: 10px; font-size: 12px; font-family: Consolas, monospace; background: #0f172a; color: #cbd5e1; border-radius: 6px; padding: 10px 12px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  #importLog .ok { color: #4ade80; }
  #importLog .err { color: #f87171; font-weight: 700; }
  #importLog .warn { color: #fbbf24; }
  .import-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .import-actions button { padding: 6px 14px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; background: #f6f7f9; font-size: 12px; }
  .import-actions button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  /* 词库下拉：完全自绘（参考主页面 ai-picker 典雅样式：trigger + 自绘选项面板） */
  .dict-picker {
    position: relative;
    display: inline-block;
    min-width: 180px;
    max-width: 320px;
    vertical-align: middle;
  }
  .dict-picker-select {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
    opacity: 0;
  }
  .dict-picker-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    box-sizing: border-box;
    padding: 0.55rem 0.9rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    color: #333;
    font-size: 0.92rem;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s ease;
  }
  .dict-picker-trigger::after {
    content: '▾';
    flex-shrink: 0;
    color: #888;
    font-size: 0.7rem;
  }
  .dict-picker-trigger:hover,
  .dict-picker.open .dict-picker-trigger {
    border-color: #667eea;
  }
  .dict-picker.open .dict-picker-panel {
    display: block;
  }
  .dict-picker-trigger-id {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #333;
  }
  .dict-picker-panel {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 1000;
    min-width: 100%;
    width: max-content;
    max-width: 460px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 6px;
    background: #fff;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    border-radius: 10px;
    display: none;
  }
  .dict-picker-section + .dict-picker-section {
    border-top: 1px solid #f0f0f2;
    margin-top: 4px;
    padding-top: 2px;
  }
  .dict-picker-section-title {
    padding: 3px 10px 2px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #999;
  }
  /* 每栏 min-height = 单个词条高度（空栏也占位，方便拖入） */
  .dict-picker-list {
    min-height: 34px;
    border-radius: 6px;
    transition: background 0.15s ease;
  }
  .dict-picker-list.drag-over,
  .dict-picker-section.drag-over {
    background: #eef0ff;
    outline: 1px dashed #667eea;
    outline-offset: -1px;
    border-radius: 6px;
  }
  /* 拖拽进行中：禁止文本选择 */
  body.dict-dragging {
    user-select: none;
    -webkit-user-select: none;
  }
  .dict-picker-list .dict-picker-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    box-sizing: border-box;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: grab;
    font-size: 0.88rem;
    color: #333;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
  }
  .dict-picker-list .dict-picker-item:active { cursor: grabbing; }
  .dict-picker-list .dict-picker-item:hover { background: #f4f4f5; }
  .dict-picker-list .dict-picker-item-active {
    background: #eef0ff;
    color: #667eea;
    font-weight: 600;
  }
  .dict-picker-item-id {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .dict-picker-item-tag {
    flex-shrink: 0;
    font-size: 0.76rem;
    color: #aaa;
  }
  /* 重命名笔形 icon：默认隐藏，悬浮词条项时显示在 id 右侧 */
  .dict-picker-item-rename {
    flex-shrink: 0;
    display: none;
    width: 20px;
    height: 20px;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: #999;
    padding: 0;
    cursor: pointer;
  }
  .dict-picker-item:hover .dict-picker-item-rename { display: inline-flex; }
  .dict-picker-item .dict-picker-item-rename:hover {
    background: #eef0ff;
    color: #667eea;
  }
  /* 重命名编辑态：输入框 + 勾号确认 */
  .dict-picker-item-edit {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .dict-picker-item-edit-input {
    flex: 1;
    min-width: 0;
    padding: 3px 7px;
    border: 1px solid #667eea;
    border-radius: 5px;
    font-size: 0.85rem;
    color: #333;
    background: #fff;
    outline: none;
  }
  .dict-picker-item-edit-ok {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 5px;
    background: #667eea;
    color: #fff;
    font-size: 12px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>词典数据浏览</h1>
  <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
    <button id="importBtn" title="导入 MDX 词库" style="padding:7px 12px; font-size:14px; border:1px solid #ccc; border-radius:6px; background:#2563eb; color:#fff; cursor:pointer; font-weight:600;">📥 导入</button>
    <button id="scan" title="选择文件夹扫描 *-dict.js" style="padding:7px 12px; font-size:14px; border:1px solid #ccc; border-radius:6px; background:#fff; cursor:pointer;">📁 扫描</button>

  <div class="import-bar" id="importBar" style="display:none;">

<script>
// 兼容 UMD 算法库（无 AMD 环境时避免 define 报错）
// 模拟 AMD define：把工厂返回值挂到 window（函数取 .name，对象取 return 的变量名），供后续 window.ripemd128 / window.lzo1x 使用
if (typeof window.define !== 'function') {
  window.define = function (factory) {
    const result = typeof factory === 'function' ? factory() : factory;
    let name = result && typeof result === 'function' ? result.name : '';
    if (!name && typeof factory === 'function') {
      const m = /return\s+([A-Za-z_$][\w$]*)/.exec(Function.prototype.toString.call(factory));
      if (m) name = m[1];
    }
    if (name) window[name] = result;
    return result;
  };
}
</script>
<script src="./_minilzo-decompress.js"></script>
<script src="./_ripemd128.js"></script>
<script>
(function () {
  // 词典数据缓存：varName -> {name, data, loaded}
  const DICTS = {};
  let cur = null, keys = [], filtered = [], page = 0;
  const PAGE = 50;
  const $ = (id) => document.getElementById(id);
  // 查询模式：主页通过 iframe ?mode=lookup 嵌入，仅作为词条检索引擎
  const LOOKUP = /[?&]mode=lookup/.test(location.search);
  let lookupReady = false; // 引擎初始化完成标志：供 hello 握手时补发 ready
  if (LOOKUP) document.body.classList.add('lookup-mode');

  // 纯文本提取（用于列表预览）
  function toText(html) {
    return String(html)
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/p>/gi, '\n')
      .replace(/<[^>]+>/g, ' ')
      .replace(/&nbsp;/g, ' ')
      .replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/\s+/g, ' ').trim();
  }

  // HTML 转义（插入基础词典等外部文本到 innerHTML 前使用）
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function humanSize(bytes) {
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
    if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return bytes + ' B';
  }

  // 动态加载脚本
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      // 追加版本参数，避免浏览器缓存旧的词典数据（词典内容更新后递增 v）
      s.src = src + (src.indexOf('?') >= 0 ? '&' : '?') + 'v=2';
      s.onload = resolve;
      s.onerror = () => reject(new Error('加载失败: ' + src));
      document.head.appendChild(s);
    });
  }

  // 构建重定向表：@@@LINK=xxx 的条目不参与检索，点击时跳转到目标词条
  function buildRedirects(data) {
    const redirects = {};
    let normal = 0;
    for (const k of Object.keys(data)) {
      const v = String(data[k]);
      const m = /^@@@LINK=(.+)$/.exec(v.trim());
      if (m) redirects[k] = m[1].trim();
      else normal++;
    }
    return { redirects, normal };
  }
  // 解析重定向链（防环）
  function resolveRedirect(varName, w) {
    const d = DICTS[varName];
    if (!d) return w; // 未导入/未加载词典：无重定向
    const r = d.redirects || {};
    const seen = {};
    while (r[w] && !seen[w]) { seen[w] = true; w = r[w]; }
    return w;
  }

  // ---- IndexedDB 词典缓存：加载过一次后，重启网页秒载（file:// 下 IDB 不可用则自动跳过） ----
  // 缓存内容版本：词典数据文件内容更新后递增，使旧缓存失效、强制重新加载
  const DICT_CACHE_VERSION = 2;
  let idbPromise = null;
  function idb() {
    if (idbPromise) return idbPromise;
    idbPromise = new Promise((res) => {
      if (!('indexedDB' in window)) return res(null);
      const rq = indexedDB.open('dict-cache', 1);
      rq.onupgradeneeded = () => { try { rq.result.createObjectStore('dicts'); } catch (e) {} };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
    });
    return idbPromise;
  }
  function idbGet(k) {
    return idb().then(db => new Promise((res) => {
      if (!db) return res(null);
      const rq = db.transaction('dicts').objectStore('dicts').get(k);
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => res(null);
    }));
  }
  function idbPut(k, v) {
    return idb().then(db => new Promise((res) => {
      if (!db) return res();
      try {
        const rq = db.transaction('dicts', 'readwrite').objectStore('dicts').put(v, k);
        rq.onsuccess = () => res();
        rq.onerror = () => res();
      } catch (e) { res(); }
    }));
  }

  // 启用状态持久化（localStorage，跨会话记忆；默认全部启用）
  function getEnabledDicts() {
    try { const arr = JSON.parse(localStorage.getItem('enabledDicts') || '[]'); return Array.isArray(arr) ? arr : []; } catch (e) { return []; }
  }
  function setEnabledDicts(arr) {
    try { localStorage.setItem('enabledDicts', JSON.stringify(arr)); } catch (e) { /* 无痕模式忽略 */ }
  }
  // 见过的词典（所有扫描到过的 varName）：用于区分"新发现"（默认启用）与"被禁用"（保持禁用）
  function getKnownDicts() {
    try { const arr = JSON.parse(localStorage.getItem('knownDicts') || '[]'); return Array.isArray(arr) ? arr : []; } catch (e) { return []; }
  }
  function setKnownDicts(arr) {
    try { localStorage.setItem('knownDicts', JSON.stringify(arr)); } catch (e) { /* 无痕模式忽略 */ }
  }
  function isEnabled(varName) { return getEnabledDicts().includes(varName); }
  // 首次进入默认应用的词典（其余默认卸载，可在 AI 工坊的词典卡片上按需「应用」）
  const DEFAULT_ENABLED_VARS = ['OALDPE_DICT', 'COLLINS_DICT', '英语词根词缀词频_DICT'];

  // ---- 词典清单持久化：进入网页直接加载已启用的词典，跳过每次清单扫描 ----
  // 仅持久化 URL 模式（text 模式词典跨会话无法复用）。统一用相对路径 ../data/，
  // file:// 与 serve（http://localhost:8377/tools/）下都能解析到 data/ 目录。
  function saveMetas(metas) {
    try {
      // 保留已有自定义名称（重命名），避免重新扫描/加载时被文件原名覆盖
      let prevName = {};
      try {
        const prev = JSON.parse(localStorage.getItem('dictMetas') || '[]');
        (Array.isArray(prev) ? prev : []).forEach(m => { if (m.varName && m.name) prevName[m.varName] = m.name; });
      } catch (e) { /* 忽略 */ }
      const list = (metas || [])
        .filter(m => m.url && !m.text)
        .map(m => ({ name: prevName[m.varName] || m.name, varName: m.varName, file: m.file || (m.url || '').split('/').pop(), mdd: m.mdd, size: m.size || 0 }));
      if (list.length) localStorage.setItem('dictMetas', JSON.stringify(list));
    } catch (e) { /* 无痕模式忽略 */ }
  }
  function getSavedMetas() {
    try {
      const list = JSON.parse(localStorage.getItem('dictMetas') || '[]');
      return Array.isArray(list) ? list
        .filter(m => m.file)
        .map(m => ({ name: m.name, varName: m.varName, mdd: m.mdd, size: m.size || 0, url: '../data/' + m.file })) : [];
    } catch (e) { return []; }
  }
  // 将单条词典写入持久化清单 dictMetas（导入/保存后用，保证下次启动快速路径能加载到）
  function upsertSavedMeta(meta) {
    try {
      const list = JSON.parse(localStorage.getItem('dictMetas') || '[]');
      const arr = Array.isArray(list) ? list : [];
      const i = arr.findIndex(x => x.varName === meta.varName);
      if (i >= 0) arr[i] = Object.assign(arr[i], meta);
      else arr.push(meta);
      localStorage.setItem('dictMetas', JSON.stringify(arr));
    } catch (e) { /* 无痕模式忽略 */ }
  }

  // 注册词典占位（不加载数据）：保存名称与后续加载所需 meta
  function registerDict(meta) {
    const d = DICTS[meta.varName] || {};
    d.name = meta.name;
    d.mdd = meta.mdd;
    d.size = meta.size || 0;
    d.meta = { varName: meta.varName, name: meta.name, url: meta.url, text: meta.text, size: meta.size, mdd: meta.mdd };
    d.enabled = isEnabled(meta.varName);
    DICTS[meta.varName] = d;
    return d;
  }

  // 卸载词典：释放数据，仅保留占位（方便重新启用）
  function unloadDict(varName) {
    const d = DICTS[varName];
    if (!d) return;
    delete d.data;
    delete d.redirects;
    delete d.count;
    delete d.sortedKeys;
    try { delete window[varName]; } catch (e) { window[varName] = undefined; }
  }

  // 动态加载词典（支持 URL 脚本 与 已读取文本两种模式）
  function loadDict(meta) {
    registerDict(meta);
    return idbGet(meta.varName).then(cached => {
      // 命中缓存：需内容版本一致（版本不一致说明词典文件已更新，旧缓存作废）
      if (cached && cached.data && cached.v === DICT_CACHE_VERSION && (!meta.size || cached.size === meta.size)) {
        window[meta.varName] = cached.data;
        const d = DICTS[meta.varName];
        d.data = cached.data;
        d.enabled = true;
        // redirects/normal 已在缓存中则直接复用，避免重新遍历全表构建
        if (cached.redirects) {
          d.redirects = cached.redirects;
          d.count = cached.normal;
        } else {
          const { redirects, normal } = buildRedirects(cached.data);
          d.redirects = redirects; d.count = normal;
          idbPut(meta.varName, { v: DICT_CACHE_VERSION, size: meta.size || 0, data: cached.data, redirects, normal });
        }
        d.sortedKeys = null;
        buildSortedKeysAsync(meta.varName);
        return;
      }
      return Promise.resolve()
        .then(() => {
          if (meta.text != null) {
            // Blob URL + <script> 异步加载，避免 window.eval 同步阻塞主线程
            return new Promise((res, rej) => {
              try {
                const url = URL.createObjectURL(new Blob([meta.text], { type: 'text/javascript' }));
                const s = document.createElement('script');
                s.src = url;
                s.onload = () => { URL.revokeObjectURL(url); res(); };
                s.onerror = () => { URL.revokeObjectURL(url); rej(new Error('解析失败: ' + meta.name)); };
                document.head.appendChild(s);
              } catch (e) { rej(e); }
            });
          } else {
            return loadScript(meta.url);
          }
        })
        .then(() => {
          const data = window[meta.varName];
          if (!data) throw new Error(meta.name + ' 未定义全局变量 ' + meta.varName);
          const { redirects, normal } = buildRedirects(data);
          const d = DICTS[meta.varName];
          d.data = data; d.count = normal; d.redirects = redirects; d.enabled = true;
          d.sortedKeys = null; // 后台构建，首次切换时不再卡顿
          // 后台写入缓存（不阻塞加载流程）
          idbPut(meta.varName, { v: DICT_CACHE_VERSION, size: meta.size || 0, data: data, redirects, normal });
          // 空闲时预构建排序 key（切词库/首屏直接复用，省去首次同步排序）
          buildSortedKeysAsync(meta.varName);
        });
    });
  }

  // 空闲时后台构建 sortedKeys（避免首屏/切词库时同步卡顿）
  const buildSortedKeysAsync = (function () {
    const queue = [];
    let running = false;
    const drain = () => {
      running = false;
      const v = queue.shift();
      if (!v) return;
      const d = DICTS[v];
      if (d && d.data && !d.sortedKeys) {
        const r = d.redirects || {};
        d.sortedKeys = Object.keys(d.data).filter(k => !r[k]).sort();
      }
      if (queue.length) schedule();
    };
    const schedule = () => {
      if (running) return;
      running = true;
      const idle = window.requestIdleCallback || ((cb) => setTimeout(cb, 200));
      idle(() => drain(), { timeout: 1000 });
    };
    return (varName) => { queue.push(varName); schedule(); };
  })();

  // 应用词典列表：注册全部占位，仅加载已启用的
  // priority（可选）：优先同步加载该词典（最近用的），其余已启用词典后台静默加载，不阻塞主线程

  // 加载词典并自动清理失效记录：文件缺失/损坏时从持久化清单 dictMetas 移除，
  // 避免每次启动都因找不到文件而反复报错（如旧版导入保存到了错误目录）
  async function loadDictSafe(meta) {
    try {
      await loadDict(meta);
    } catch (e) {
      try {
        const list = JSON.parse(localStorage.getItem('dictMetas') || '[]');
        const arr = Array.isArray(list) ? list : [];
        const next = arr.filter(x => x.varName !== meta.varName);
        if (next.length !== arr.length) localStorage.setItem('dictMetas', JSON.stringify(next));
      } catch (e2) { /* 忽略 */ }
      delete DICTS[meta.varName]; // 从占位中移除，避免下拉出现死词库
    }
  }

  async function applyMetas(metas, priority) {
    if (!metas.length) return;
    let enabledArr = getEnabledDicts();
    let known = getKnownDicts();
    let changed = false;
    if (!known.length) {
      // 首次升级（尚无 knownDicts）：当前扫描到的全部视为已见过，保持 enabledDicts 现状，
      // 避免把用户已禁用的词典重新加回
      known = metas.map(m => m.varName);
      // 首次进入（从无启用记录）：默认只应用三本常用词典，其余保持卸载以减少加载时间
      if (localStorage.getItem('enabledDicts') === null) {
        enabledArr = known.filter(v => DEFAULT_ENABLED_VARS.includes(v));
        changed = true;
      }
    }
    for (const meta of metas) {
      if (!known.includes(meta.varName)) {
        // 新发现的词典：默认启用，并记入 known
        known.push(meta.varName);
        if (!enabledArr.includes(meta.varName)) { enabledArr.push(meta.varName); changed = true; }
      }
      // 已见过的词典：保持 enabledDicts 中的状态，不自动加回（被禁用的保持禁用）
      registerDict(meta);
    }
    // 移除已不存在的词典记录
    const valid = enabledArr.filter(v => DICTS[v]);
    if (valid.length !== enabledArr.length) changed = true;
    enabledArr = valid;
    if (changed) setEnabledDicts(enabledArr);
    setKnownDicts(known);
    // 持久化清单，下次进入直接复用，跳过清单扫描
    saveMetas(metas);
    const toLoad = metas.filter(meta => {
      const d = DICTS[meta.varName];
      return d && d.enabled && !d.data;
    });
    if (!toLoad.length) return;
    // 优先加载最近用的词典（若有），其余后台静默加载
    const prioMeta = priority ? (toLoad.find(m => m.varName === priority) || null) : null;
    if (prioMeta) {
      showLoading('正在加载「' + prioMeta.name + '」…');
      await loadDictSafe(prioMeta);
      const rest = toLoad.filter(m => m !== prioMeta);
      if (rest.length) {
        // 后台静默加载其余已启用词典：不 await，加载完成后刷新下拉
        Promise.all(rest.map(meta => loadDictSafe(meta)))
          .then(() => {
            try { renderSelect(); } catch (e) { /* 忽略 */ }
            broadcastPickerState();
            if (LOOKUP) post({ type: 'dicts-updated' });
          });
      }
    } else {
      showLoading('正在加载已启用的词典（' + toLoad.length + ' 本）…');
      await Promise.all(toLoad.map(meta => loadDictSafe(meta)));
    }
  }

  // 词条 HTML 渲染：注入词典 CSS、重写资源相对路径
  function renderDictHtml(html, varName) {
    const d = DICTS[varName];
    let out = String(html).replace(/<head[\s\S]*?<\/head>/i, '');
    if (d && d.mdd) {
      const base = '../data/' + d.mdd + '/';
      // 相对资源引用（图片等）→ 资源目录
      out = out.replace(/(src|href)=("|')(?!([a-z]+:|\/|\.\.\/|#|entry:|d:))([^"']+\.(png|gif|jpg|jpeg|svg|webp|css|js|mp3|wav|spx))("|')/gi,
        (m, attr, q, _, fname, ext, q2) => attr + '=' + q + base + fname + q2);
    }
    return out;
  }

  // ==================== Collins 词条美化（词性缩写 + 主词高亮） ====================
  // 单个词性代码 → 缩写（覆盖 collins .st 标签出现的全部码表）
  function collinsPosAbbr(code) {
    const c = String(code || '').toUpperCase().replace(/\s+/g, ' ').trim();
    if (!c) return null;
    if (c.startsWith('PHRASAL VERB')) return 'phrasal v.';
    if (c.startsWith('N-COUNT')) return 'n.[C]';
    if (c.startsWith('N-UNCOUNT')) return 'n.[U]';
    if (c.startsWith('N-SING')) return 'n.[S]';
    if (c.startsWith('N-PLURAL')) return 'n.pl.';
    if (c.startsWith('N-')) return 'n.';
    if (c.startsWith('VERB')) return 'v.';
    if (c.startsWith('V PHR')) return 'v. phr.';
    if (c.startsWith('V-')) return 'v.';
    if (c === 'AUX') return 'aux.';
    if (c.startsWith('MODAL')) return 'modal';
    if (c.startsWith('ADJ')) return 'adj.';
    if (c.startsWith('ADV')) return 'adv.';
    if (c.startsWith('PREP')) return 'prep.';
    if (c.startsWith('CONJ')) return 'conj.';
    if (c.startsWith('PRON')) return 'pron.';
    if (c.startsWith('PREDET')) return 'predet.';
    if (c.startsWith('DET')) return 'det.';
    if (c.startsWith('NUM')) return 'num.';
    if (c.startsWith('ORD')) return 'ord.';
    if (c.startsWith('QUANT')) return 'quant.';
    if (c.startsWith('PHRASE') || c.startsWith('PHR')) return 'phr.';
    if (c.startsWith('CONVENTION')) return 'convention';
    if (c.startsWith('EXCLAM')) return 'excl.';
    if (c.startsWith('INTERJ')) return 'interj.';
    if (c.startsWith('PREFIX')) return 'prefix';
    if (c.startsWith('SUFFIX')) return 'suffix';
    if (c.startsWith('COMB')) return 'comb.';
    if (c.startsWith('NEG')) return 'neg.';
    if (c.startsWith('QUEST')) return 'quest.';
    if (c.startsWith('SOUND')) return 'sound';
    if (c.startsWith('COLOUR')) return 'color';
    if (c.startsWith('FRACTION')) return 'frac.';
    return null;
  }
  // 整段词性（可能含 "N-COUNT; N-IN-NAMES" 组合）→ 缩写串，如 "n.[C]"
  function collinsPosAbbrText(raw) {
    const en = String(raw || '').split('\t')[0].trim(); // 取 tab 前的英文代码部分
    if (!en) return null;
    const list = [];
    en.split(/[;,]/).map(s => s.trim()).filter(Boolean).forEach(p => {
      const a = collinsPosAbbr(p);
      if (a && list.indexOf(a) < 0) list.push(a);
    });
    if (!list.length) return null;
    // 去掉被更具体项包含的基础项（如 "n." 已被 "n.[C]" 覆盖）
    const filtered = list.filter(a => !list.some(b => b !== a && b.startsWith(a)));
    return (filtered.length ? filtered : list).join('/');
  }
  // 两词公共前缀长度
  function sharedPrefixLen(a, b) {
    let i = 0;
    const n = Math.min(a.length, b.length);
    while (i < n && a[i] === b[i]) i++;
    return i;
  }
  // 主词高亮：把容器文本节点中整词匹配的查询词及其词形变体包成 .collins-hl（不动标签与属性）
  // words 可为单词或候选数组（含词形/不规则变体，来自主页 app.buildKeywordCandidates）
  function highlightHeadword(root, words) {
    if (!root) return;
    const list = (Array.isArray(words) ? words : [words])
      .map(x => String(x || '').trim().toLowerCase())
      .filter(x => x && /^[a-z][a-z'-]*$/.test(x));
    if (!list.length) return;
    // 仅保留与主词同根的变体（共享足够长的前缀），并过滤长度<4 的短候选（如 be→bed），
    // 避免把功能词/无关短词整篇点亮
    const head = list[0];
    const minShared = Math.min(4, Math.max(2, head.length - 1));
    const uniq = [];
    list.forEach(x => {
      if (uniq.indexOf(x) >= 0) return;
      if (x === head || (x.length >= 4 && sharedPrefixLen(x, head) >= minShared)) uniq.push(x);
    });
    uniq.sort((a, b) => b.length - a.length); // 长词优先，避免短词抢先匹配
    const esc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    let re;
    try {
      re = new RegExp('(^|[^A-Za-z])(' + uniq.map(esc).join('|') + ')(?![A-Za-z])', 'gi');
    } catch (e) { return; }
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const texts = [];
    let n;
    while ((n = walker.nextNode())) {
      if (n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('collins-hl')) continue;
      re.lastIndex = 0;
      if (re.test(n.nodeValue)) texts.push(n);
    }
    texts.forEach(node => {
      const s = node.nodeValue;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      re.lastIndex = 0;
      while ((m = re.exec(s))) {
        const idx = m.index + m[1].length; // 跳过前缀边界字符
        const hit = m[2];
        if (idx > last) frag.appendChild(document.createTextNode(s.slice(last, idx)));
        const span = document.createElement('span');
        span.className = 'collins-hl';
        span.textContent = hit;
        frag.appendChild(span);
        last = idx + hit.length;
      }
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      if (node.parentNode) node.parentNode.replaceChild(frag, node);
    });
    // 二次处理：Collins 把派生后缀放在 .text_blue 之外（如 <span class='text_blue'>forbid</span>den → forbidden、
    // ...</span>s → forbids），导致只点亮了词根。此处把紧邻其后的后缀字母并入高亮，使完整变形词整体高亮。
    const candSet = new Set(uniq);
    root.querySelectorAll('.collins-hl').forEach(hl => {
      // 找紧邻的后继文本节点：优先 hl 自身后继
      let nextText = null;
      for (let s = hl.nextSibling; s; s = s.nextSibling) {
        if (s.nodeType === 3) { nextText = s; break; }
        if (s.nodeType === 1) break;
      }
      // hl 位于内联元素（.text_blue / <b> 等）末尾时，再看该元素的后继文本节点
      if (!nextText) {
        const p = hl.parentNode;
        if (p && p !== root && p.nodeType === 1 && p.lastChild === hl && /^(span|b|i|em|strong|a|font|u)$/i.test(p.tagName)) {
          for (let s = p.nextSibling; s; s = s.nextSibling) {
            if (s.nodeType === 3) { nextText = s; break; }
            if (s.nodeType === 1) break;
          }
        }
      }
      if (!nextText) return;
      const m = /^[A-Za-z]+/.exec(nextText.nodeValue || '');
      if (!m) return;
      const run = m[0].slice(0, 6); // 派生后缀（s/es/ed/ing/den/ren…）通常很短
      // 仅当合并后确为本词的候选变形才并入（forbid+s→forbids、forbid+den→forbidden），避免误扩
      let take = 0;
      for (let k = run.length; k >= 1; k--) {
        if (candSet.has((hl.textContent + run.slice(0, k)).toLowerCase())) { take = k; break; }
      }
      if (!take) return;
      hl.textContent = hl.textContent + run.slice(0, take);
      nextText.nodeValue = nextText.nodeValue.slice(take);
    });
  }
  // 语法/搭配框节点（【搭配模式】等）：重排时保持其位于末尾
  function isCollinsGrammarNode(n) {
    if (!n || n.nodeType !== 1) return false;
    if (n.id && /^(word_gram_|tips_posp_)/.test(n.id)) return true;
    return !!(n.querySelector && n.querySelector('[id^="word_gram_"], [id^="tips_posp_"]'));
  }
  // 调整单个 .caption 排列：英文释义行在上、"序号+词性+中文释义"行在下
  // 原：1.n.[C] 释义 <英文释义>  →  改：<英文释义>\n1.n.[C] 释义
  // 交叉引用（→see / See also，含 a.explain / .text_gray）与相关词组（<dl>）保持原样
  function reorderCollinsCaption(caption) {
    if (!caption) return;
    if (caption.querySelector('a.explain, .text_gray, dl')) return;
    // 取直接子级、非空的中文释义 .text_blue
    let blue = null;
    for (let n = caption.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 1 && n.classList && n.classList.contains('text_blue') && n.textContent.trim()) { blue = n; break; }
    }
    if (!blue) return;
    // 收集 .text_blue 之后的英文释义节点（跳过语法框）
    const defNodes = [];
    for (let n = blue.nextSibling; n; n = n.nextSibling) {
      if (isCollinsGrammarNode(n)) continue;
      defNodes.push(n);
    }
    if (!defNodes.length) return;
    if (!defNodes.some(n => n.nodeType === 1 || (n.nodeValue && n.nodeValue.trim()))) return; // 仅空白则不动
    // 英文释义整体上移至最前，独立成行
    const wrap = document.createElement('span');
    wrap.className = 'collins-def';
    defNodes.forEach(n => wrap.appendChild(n));
    // 在英文释义行前侧也补上义项序号（如 "1. If someone permits..."），与下行序号同款
    let numEl = null;
    for (let n = caption.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 1 && n.classList && n.classList.contains('num')) { numEl = n; break; }
    }
    if (numEl && numEl.textContent.trim()) wrap.insertBefore(numEl.cloneNode(true), wrap.firstChild);
    caption.insertBefore(wrap, caption.firstChild);
  }
  // 美化 Collins 词条：排列调整 + 缩写 .st 词性 + 高亮主词及其词形变体（仅作用于含 .tab_content/dict_tab_* 的词条）
  function beautifyCollins(box, headword, cands) {
    if (!box) return;
    const tabs = [];
    box.querySelectorAll('.tab_content, [id^="dict_tab_"]').forEach(el => {
      if (tabs.indexOf(el) < 0) tabs.push(el);
    });
    if (!tabs.length) return;
    // 高亮候选：主词 + 主页传入的词形/不规则变体（如 forbid → forbidden）
    const hlWords = [headword].concat(Array.isArray(cands) ? cands : []);
    tabs.forEach(tab => {
      tab.querySelectorAll('.caption').forEach(reorderCollinsCaption);
      tab.querySelectorAll('.st').forEach(el => {
        if (el.children && el.children.length) return; // 内含提示框（如 tips_posp），不缩写以免破坏内容
        const raw = el.textContent;
        const abbr = collinsPosAbbrText(raw);
        if (abbr) {
          el.setAttribute('title', raw.replace(/\s+/g, ' ').trim());
          el.textContent = abbr;
        }
      });
      highlightHeadword(tab, hlWords);
    });
  }

  // 注入词典 CSS 到页面：提取真实 css 文件名，重写包内绝对路径（/font/ 等）
  // 优先 fetch 文本重写后 <style> 注入（serve 模式）；file:// 下回退 <link>
  const injectedCss = {};
  async function injectDictCss(varName) {
    const d = DICTS[varName];
    if (!d || !d.mdd || injectedCss[varName]) return;
    // 从任一词条 HTML 提取真实 css 文件名
    let cssName = d.mdd + '.css';
    for (const k of Object.keys(d.data)) {
      const m = /href\s*=\s*["']([^"']+\.css)["']/i.exec(String(d.data[k]));
      if (m) { cssName = m[1].replace(/^.*\//, ''); break; }
    }
    injectedCss[varName] = true;
    const base = '../data/' + d.mdd + '/';
    // file:// 下 fetch 本地文件会被 CORS 拦截（其他词典 mdd 为空不触发），直接 <link> 注入，避免控制台报错
    if (location.protocol === 'file:') {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = base + cssName;
      document.head.appendChild(link);
      return;
    }
    try {
      const resp = await fetch(base + cssName);
      if (!resp.ok) throw new Error('http ' + resp.status);
      let css = await resp.text();
      // 重写 css 内 url 引用：/font/x.ttf 与相对 x.ttf → ../data/<mdd>/x.ttf
      css = css.replace(/url\(\s*(['"]?)(?![a-zA-Z][a-zA-Z0-9+.-]*:|\/\/|#|\()([^'")]+)\1\s*\)/g,
        (m, q, p) => 'url(' + q + base + p.replace(/^\/+/, '') + q + ')');
      const style = document.createElement('style');
      style.textContent = css;
      document.head.appendChild(style);
    } catch (e) {
      // file:// 或 fetch 受限：回退 link（样式生效，字体可能回退）
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = base + cssName;
      document.head.appendChild(link);
    }
  }

  // 发音：拦截 sound:// 链接
  // 优先取按钮所在例句段落（<x>…</x>）的英文文本；无则回退文件名清洗出的单词
  function playPronounce(word, anchor) {
    // 1) 优先：锚点所在例句段落（<rx-g> 容器内的 <x> 文本）的英文
    let text = '';
    if (anchor) {
      let el = anchor.parentElement;
      while (el && el !== $('detail')) {
        const tag = el.tagName;
        if (tag === 'X') { text = el.textContent.trim(); break; }
        if (tag === 'RX-G') {
          // 例句 🔊 常在 <x> 之后（</x><a …>），取容器内第一个 <x>
          const xEl = el.querySelector('x');
          if (xEl) text = xEl.textContent.trim();
          break;
        }
        el = el.parentElement;
      }
      // 清理：去掉中文/音标/多余空白
      text = text.replace(/[\u4e00-\u9fff（）：；，。]/g, ' ').replace(/\s+/g, ' ').trim();
      // 去掉开头的 ◆ 符号
      text = text.replace(/^[◆◇▪•]\s*/, '');
    }
    // 2) 回退：从文件名提取英文单词（词头发音 / 变形 / 语速）
    if (!text) {
      text = (word || '')
        // 去掉文件名末尾的发音标记：__gb_1 / __us_1 / __gbs_1 / __uss_2 等（如 precis__gb_1 → precis）
        .replace(/__[a-z]+(?:_\d+|\d*)$/i, '')
        .replace(/_/g, ' ')
        .replace(/[_\-\d]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }
    if (!text) return;
    // 优先：播放词典源的真实音频（data/<mdd>/<文件名>），失败回退 TTS
    const mddName = (cur && DICTS[cur]) ? (DICTS[cur].mdd || '') : '';
    if (mddName && /\.(mp3|wav|spx|ogg)$/i.test(word || '')) {
      const src = '../data/' + mddName + '/' + (word || '');
      const audio = new Audio(src);
      audio.onerror = () => { speechFallback(text); };
      audio.play().catch(() => { speechFallback(text); });
      return;
    }
    speechFallback(text);
  }
  // 回退：优先 Edge 在线神经语音（读取主页基本设置 voiceEngine/voiceModel/voiceRate），失败再本地/系统
  function readBasicSetting(key) {
    try {
      const username = localStorage.getItem('wordMemory_currentUser');
      if (!username) return undefined;
      const config = JSON.parse(localStorage.getItem('wordMemory_user_json_' + username) || 'null');
      if (!config) return undefined;
      const v = config.basicSettings ? config.basicSettings[key] : undefined;
      return v;
    } catch (e) { return undefined; }
  }
  function speechFallback(text) {
    try {
      if (text && readBasicSetting('voiceEngine') === 'edge') {
        const voice = readBasicSetting('voiceModel') || 'en-GB-LibbyNeural';
        const rate = readBasicSetting('voiceRate') || 1.0;
        const ratePct = Math.round((rate - 1) * 100);
        const url = 'http://127.0.0.1:8890/tts?voice=' + encodeURIComponent(voice) +
          '&text=' + encodeURIComponent(text) +
          '&rate=' + encodeURIComponent((ratePct >= 0 ? '+' : '') + ratePct + '%');
        const audio = new Audio(url);
        audio.onerror = () => { systemTTS(text); };
        audio.play().catch(() => { systemTTS(text); });
        return;
      }
    } catch (e) { /* 回退本地/系统 */ }
    // 本地语音引擎：优先本地离线音频（static/audio/<首字母>/<word>.mp3），缺失回退浏览器语音
    tryLocalAudio(text);
  }
  function tryLocalAudio(text) {
    const w = String(text || '').trim().toLowerCase();
    if (!w) { systemTTS(text); return; }
    const c = /[a-z]/.test(w[0]) ? w[0] : 'misc';
    const name = w.replace(/[\\/:*?"<>|]/g, '_');
    const audio = new Audio('../static/audio/' + c + '/' + name + '.mp3');
    let settled = false;
    const fail = () => { if (!settled) { settled = true; systemTTS(text); } };
    audio.oncanplay = () => {
      if (settled) return;
      settled = true;
      audio.play().catch(fail);
    };
    audio.onerror = fail;
    setTimeout(fail, 2000); // 加载超时视为文件不存在
  }
  function systemTTS(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
      return;
    }
    // 兜底：Google TTS 在线发音
    const audio = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(text));
    audio.play().catch(() => {});
  }
  // 词条容器点击委托：sound:// 链接 → 发音
  $('detail').addEventListener('click', (ev) => {
    const a = ev.target.closest ? ev.target.closest('a[href^="sound://"]') : null;
    if (a) {
      ev.preventDefault();
      playPronounce(a.getAttribute('href').replace('sound://', ''), a);
    }
  });
  // 折叠块展开/折叠：模拟 oaldpe.js 的 setupUnboxFold（词条内 <script> 经 innerHTML 注入不会执行）
  // 点击 .collapse .unbox 的标题，切换 body 显隐并维护 .is-active（CSS 用 .box_title + * 默认隐藏内容）
  $('detail').addEventListener('click', (ev) => {
    const t = ev.target.closest ? ev.target.closest('.collapse .unbox .box_title') : null;
    if (!t) return;
    ev.preventDefault();
    const unbox = t.parentElement;
    const content = t.nextElementSibling;
    if (!content) return;
    if (unbox.classList.contains('is-active')) {
      unbox.classList.remove('is-active');
      content.style.display = 'none';
    } else {
      unbox.classList.add('is-active');
      content.style.display = 'block';
    }
  });
  // 词性导航栏切换：模拟 oaldpe.js 的 setupNavigation（innerHTML 不执行脚本、无 jQuery）
  // 点击 .oaldpe-nav span 切换对应 .oald 容器的 .visible class
  $('detail').addEventListener('click', (ev) => {
    const t = ev.target.closest ? ev.target.closest('.oaldpe-nav span') : null;
    if (!t) return;
    ev.preventDefault();
    const navbar = t.parentElement;
    if (!navbar || !navbar.classList.contains('oaldpe-nav')) return;
    const spans = Array.from(navbar.children);
    const index = spans.indexOf(t);
    if (index < 0) return;
    // 切换导航高亮
    spans.forEach((s, i) => s.classList.toggle('active', i === index));
    // 切换词条容器显示
    const entryContainers = Array.from(navbar.nextElementSibling ? navbar.parentElement.querySelectorAll('.oald') : []);
    if (index === spans.length - 1) {
      // 最后一个是 "All"：全部显示
      entryContainers.forEach(c => c.classList.add('visible'));
    } else {
      entryContainers.forEach((c, i) => c.classList.toggle('visible', i === index));
    }
  });
  // 缩略图放大/还原：模拟 oaldpe.js 的 setupImage（innerHTML 不执行脚本、无 jQuery）
  // 点击 #ox-enlarge 容器切换 .enlarged class，CSS 控制 .thumb/.fullsize 显隐
  $('detail').addEventListener('click', (ev) => {
    const t = ev.target.closest ? ev.target.closest('#ox-enlarge') : null;
    if (!t) return;
    ev.preventDefault();
    t.classList.toggle('enlarged');
  });

  // 目录扫描（File System Access API，Chrome/Edge 弹窗即权限询问）
  async function scanWithDirectoryPicker() {
    const dir = await window.showDirectoryPicker({ mode: 'read' });
    const found = [];
    const visit = async (handle, depth) => {
      for await (const entry of handle.values()) {
        if (entry.kind === 'file') {
          if (/^.+?-dict\.js$/i.test(entry.name)) {
            const file = await entry.getFile();
            found.push({ name: entry.name, text: await file.text() });
          }
        } else if (depth < 2 && /^(data|dicts?)$/i.test(entry.name)) {
          await visit(entry, depth + 1); // 自动进入 data/ 子目录
        }
      }
    };
    await visit(dir, 0);
    return found;
  }

  // 目录扫描（webkitdirectory 回退，Firefox 等通用）
  function scanWithFolderInput() {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.webkitdirectory = true;
      input.style.display = 'none';
      input.onchange = async () => {
        const found = [];
        for (const file of input.files || []) {
          if (/^.+?-dict\.js$/i.test(file.name)) {
            found.push({ name: file.name, text: await file.text() });
          }
        }
        resolve(found);
      };
      document.body.appendChild(input);
      input.click();
    });
  }

  function scanFolders() {
    return window.showDirectoryPicker ? scanWithDirectoryPicker() : scanWithFolderInput();
  }

  // 从 JS 文本解析全局变量名
  function parseVarName(text) {
    // 兼容中文词库变量名（\p{L} 匹配 Unicode 字母）
    const m = /var\s+([\p{L}_$][\p{L}\p{N}_$]*)\s*=\s*\{/u.exec(String(text).slice(0, 4096));
    return m ? m[1] : '';
  }

  // 获取词典清单：serve.js 实时扫描 → dict-manifest.js → 目录扫描（弹权限）
  async function loadManifest() {
    try {
      const resp = await fetch('/dict-list.json');
      if (resp.ok) {
        const list = await resp.json();
        if (list.length) return list.map(m => ({ name: m.name, varName: m.varName, url: m.url, mdd: m.mdd, size: m.size }));
      }
    } catch (e) { /* 非服务器模式 */ }
    try {
      await loadScript('../data/dict-manifest.js');
      if (window.DICT_MANIFEST && window.DICT_MANIFEST.length) {
        return window.DICT_MANIFEST.map(m => ({ name: m.name, varName: m.varName, url: '../data/' + m.file, mdd: m.mdd }));
      }
    } catch (e) { /* 无清单 */ }
    return [];
  }

  // 手动扫描文件夹并合并词典
  async function doScan() {
    showLoading('请在弹出的窗口中选择词典所在文件夹（含 *-dict.js，建议选 data 目录）…');
    let files;
    try { files = await scanFolders(); }
    catch (e) { showLoading('扫描已取消或失败: ' + e.message); return; }
    const metas = files.map(f => ({ name: f.name.replace(/-dict\.js$/i, ''), varName: parseVarName(f.text), text: f.text })).filter(x => x.varName);
    if (!metas.length) { showLoading('所选目录中未找到 *-dict.js 词典文件'); return; }
    await applyMetas(metas);
    finishLoad();
  }

  function renderSelect() {
    const sel = $('dictSelect');
    sel.innerHTML = '';
    Object.keys(DICTS).forEach(v => {
      if (!DICTS[v].enabled) return; // 禁用的不参与选择
      const d = DICTS[v];
      const op = document.createElement('option');
      op.value = v;
      op.textContent = d.name + '（' + d.count + ' 词条）';
      if (v === cur) op.selected = true;
      sel.appendChild(op);
    });
    syncDictPicker();
  }

  // ---- 词库下拉自绘 UI（参考主页 ai-picker：trigger 显示当前 + 两栏（启用/禁用）面板，支持拖拽切换） ----
  function syncDictPicker() {
    const sel = $('dictSelect');
    const triggerId = $('dictPickerTriggerId');
    const enabledBox = $('dictPickerEnabled');
    const disabledBox = $('dictPickerDisabled');
    if (!sel || !enabledBox || !disabledBox) return;
    const opt = sel.options[sel.selectedIndex];
    if (triggerId) triggerId.textContent = opt ? opt.textContent.trim() : '选择词库';
    enabledBox.innerHTML = '';
    disabledBox.innerHTML = '';
    Object.keys(DICTS).forEach(v => {
      const d = DICTS[v];
      if (!d.name) return;
      const item = document.createElement('div');
      item.className = 'dict-picker-item' + (v === cur ? ' dict-picker-item-active' : '');
      const idSpan = document.createElement('span');
      idSpan.className = 'dict-picker-item-id';
      idSpan.textContent = d.name;
      item.appendChild(idSpan);
      // 重命名笔形按钮：悬浮显示，点击进入编辑态
      const renameBtn = document.createElement('button');
      renameBtn.className = 'dict-picker-item-rename';
      renameBtn.title = '重命名词库';
      renameBtn.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
      renameBtn.addEventListener('mousedown', (e) => e.stopPropagation());
      renameBtn.addEventListener('click', (e) => { e.stopPropagation(); startRename(item, v); });
      item.appendChild(renameBtn);
      bindDictItemDrag(item, v);
      if (d.enabled) {
        const tag = document.createElement('span');
        tag.className = 'dict-picker-item-tag';
        // 后台加载中的词典：显示加载中，点击时先加载再切换
        tag.textContent = d.data ? ((d.count != null ? d.count : 0) + ' 词') : '加载中…';
        item.appendChild(tag);
        item.addEventListener('click', () => {
          if (dragState && dragState.moved) return; // 拖拽刚结束，忽略误触的 click
          if (v === cur) { $('dictPicker').classList.remove('open'); return; }
          if (!DICTS[v].data) {
            // 尚未加载完成：加载后自动切换（switchDict 内部处理）
            switchDict(v);
            $('dictPicker').classList.remove('open');
            return;
          }
          switchDict(v);
          syncDictPicker();
          $('dictPicker').classList.remove('open');
        });
        enabledBox.appendChild(item);
      } else {
        const tip = document.createElement('span');
        tip.className = 'dict-picker-item-tag';
        tip.textContent = '已禁用';
        item.appendChild(tip);
        disabledBox.appendChild(item);
      }
    });
  }

  // 重命名词库（引擎为准）：更新内存名称并持久化到共享缓存 dictMetas，主页/查词结果共用
  function saveDictName(varName, newName) {
    const d = DICTS[varName];
    if (!d || !newName) return;
    d.name = newName;
    try {
      const list = JSON.parse(localStorage.getItem('dictMetas') || '[]');
      const arr = Array.isArray(list) ? list : [];
      const m = arr.find(x => x.varName === varName);
      if (m) m.name = newName;
      localStorage.setItem('dictMetas', JSON.stringify(arr));
    } catch (e) { /* 无痕模式忽略 */ }
    renderSelect();
    broadcastPickerState();
  }

  // 进入重命名编辑态：id → 输入框 + 勾号，确认/回车保存并重绘，Esc 取消
  function startRename(item, varName) {
    const d = DICTS[varName];
    const idSpan = item.querySelector('.dict-picker-item-id');
    if (!d || !idSpan) return;
    const edit = document.createElement('span');
    edit.className = 'dict-picker-item-edit';
    const input = document.createElement('input');
    input.className = 'dict-picker-item-edit-input';
    input.value = d.name;
    input.maxLength = 40;
    input.spellcheck = false;
    const ok = document.createElement('button');
    ok.className = 'dict-picker-item-edit-ok';
    ok.title = '确认';
    ok.textContent = '✓';
    [input, ok].forEach(el => {
      el.addEventListener('mousedown', (e) => e.stopPropagation());
      el.addEventListener('click', (e) => e.stopPropagation());
    });
    const finish = (save) => {
      if (save) {
        const val = input.value.trim();
        if (val && val !== d.name) saveDictName(varName, val);
      }
      syncDictPicker();
    };
    ok.addEventListener('click', (e) => { e.stopPropagation(); finish(true); });
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') finish(true);
      else if (e.key === 'Escape') finish(false);
    });
    const renameBtn = item.querySelector('.dict-picker-item-rename');
    if (renameBtn) renameBtn.style.display = 'none';
    edit.appendChild(input);
    edit.appendChild(ok);
    item.replaceChild(edit, idSpan);
    input.focus();
    input.select();
  }

  // 词条项拖拽：基于 mouse 事件模拟（不依赖 HTML5 drag API，避免 file:// 下 dataTransfer 受限/扩展劫持）
  // 按下超过阈值位移后显示跟随 ghost，松开时按落点所在栏切换启用/禁用
  let dragState = null; // { varName, startX, startY, moved, ghost }
  function bindDictItemDrag(item, varName) {
    item.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || dragState) return;
      dragState = { varName, startX: e.clientX, startY: e.clientY, moved: false, ghost: null };
      const onMove = (ev) => {
        if (!dragState) return;
        const dx = ev.clientX - dragState.startX;
        const dy = ev.clientY - dragState.startY;
        if (!dragState.moved && Math.abs(dx) + Math.abs(dy) > 4) {
          // 位移超过阈值 → 进入拖拽，创建 ghost
          dragState.moved = true;
          const ghost = item.cloneNode(true);
          ghost.style.cssText = 'position:fixed;left:-9999px;top:-9999px;z-index:99999;opacity:0.85;pointer-events:none;width:' + item.offsetWidth + 'px;background:#fff;border:1px solid #667eea;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.2);margin:0;';
          document.body.appendChild(ghost);
          dragState.ghost = ghost;
          document.body.classList.add('dict-dragging');
        }
        if (dragState.moved && dragState.ghost) {
          dragState.ghost.style.left = (ev.clientX + 8) + 'px';
          dragState.ghost.style.top = (ev.clientY + 8) + 'px';
          highlightDropZone(ev);
        }
      };
      const onUp = (ev) => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (!dragState) return;
        const st = dragState;
        dragState = null;
        document.querySelectorAll('.dict-picker-section.drag-over').forEach(el => el.classList.remove('drag-over'));
        document.body.classList.remove('dict-dragging');
        if (st.ghost) st.ghost.remove();
        if (st.moved) {
          ev.preventDefault(); // 抑制随后的 click
          const target = document.elementFromPoint(ev.clientX, ev.clientY);
          const section = target ? target.closest('.dict-picker-section') : null;
          if (section) {
            const enable = section.getAttribute('data-zone') === 'enabled';
            if (DICTS[st.varName] && DICTS[st.varName].enabled !== enable) {
              setDictEnabled(st.varName, enable);
            }
          }
        }
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  // 拖拽过程中高亮鼠标所在栏
  function highlightDropZone(ev) {
    document.querySelectorAll('.dict-picker-section.drag-over').forEach(el => el.classList.remove('drag-over'));
    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    const section = target ? target.closest('.dict-picker-section') : null;
    if (section) section.classList.add('drag-over');
  }

  // 启用/禁用词典：更新持久化状态，异步加载/卸载数据
  async function setDictEnabled(varName, enable) {
    const d = DICTS[varName];
    if (!d) return;
    let arr = getEnabledDicts();
    if (enable) {
      if (!arr.includes(varName)) arr.push(varName);
      setEnabledDicts(arr);
      d.enabled = true;
      if (!d.data) {
        try { await loadDict(d.meta); } catch (e) { /* 加载失败保留占位 */ }
      }
    } else {
      arr = arr.filter(v => v !== varName);
      setEnabledDicts(arr);
      d.enabled = false;
      unloadDict(varName);
      // 当前选中的是被禁用的词典 → 切到第一个已启用的
      if (cur === varName) {
        const first = Object.keys(DICTS).find(v2 => DICTS[v2].enabled && DICTS[v2].data);
        if (first) switchDict(first);
        else {
          cur = null; keys = []; filtered = [];
          $('detail').style.display = 'none';
          render();
          renderSelect();
        }
      }
    }
    renderSelect();
    syncDictPicker();
    broadcastPickerState();
  }

  // 绑定 trigger 开合 / 外部点击关闭
  function initDictPicker() {
    const picker = $('dictPicker');
    const trigger = $('dictPickerTrigger');
    const panel = $('dictPickerPanel');
    if (!picker || !trigger || !panel) return;
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      picker.classList.toggle('open');
    });
    panel.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => picker.classList.remove('open'));
  }
  initDictPicker();

  function switchDict(v) {
    const d = DICTS[v];
    if (!d || !d.enabled) return; // 禁用的不可切换
    if (!d.data) {
      // 后台加载尚未完成：触发加载，完成后自动切换
      loadDict(d.meta).then(() => switchDict(v)).catch(() => {});
      return;
    }
    cur = v;
    // 记住本次选择，刷新后自动恢复
    try { localStorage.setItem('browseDictCur', v); } catch (e) { /* 无痕模式忽略 */ }
    const r = DICTS[v].redirects || {};
    // sortedKeys 缓存：词典数据不可变，首次构建后直接复用，切词库不再重复排序（O(n log n) → O(1)）
    if (!DICTS[v].sortedKeys) {
      DICTS[v].sortedKeys = Object.keys(DICTS[v].data).filter(k => !r[k]).sort();
    }
    keys = DICTS[v].sortedKeys;
    $('detail').style.display = 'none';
    $('dictSelect').value = v;
    syncDictPicker();
    // 优先显示最近查阅列表（历史跨词典共享：仅显示在新词典中存在释义的词）
    try {
      const key = 'recentWords';
      const recent = JSON.parse(localStorage.getItem(key) || '[]');
      const valid = recent.filter(w => DICTS[v].data[w] != null);
      if (valid.length) {
        filtered = valid;
        page = 0;
        render();
        broadcastPickerState();
        return;
      }
    } catch (e) { /* 忽略 */ }
    // 无最近记录：显示全部
    refresh();
    broadcastPickerState();
  }

  // 词库下拉：更换勾选立即生效；搜索栏有词时立即展示该词在新词库的结果
  $('dictSelect').addEventListener('change', () => {
    const v = $('dictSelect').value;
    syncDictPicker();
    if (!v || v === cur) return;
    switchDict(v);
    const q = $('search').value.trim().toLowerCase();
    if (q) {
      // 若该词在当前词库存在，直接展示；否则展示匹配列表第一个
      const target = resolveRedirect(v, q);
      if (DICTS[v].data[target] != null) showDetail(target);
      else if (filtered.length) showDetail(filtered[0]);
    }
  });

  // 前缀二分：在已排序 keys 中定位 [q, q+FFFF) 区间（O(log n)，大词库即时响应）
  function prefixRange(sorted, q) {
    let lo = 0, hi = sorted.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (sorted[m] < q) lo = m + 1; else hi = m; }
    const start = lo;
    hi = sorted.length;
    const max = q + '\uFFFF';
    while (lo < hi) { const m = (lo + hi) >> 1; if (sorted[m] <= max) lo = m + 1; else hi = m; }
    return sorted.slice(start, lo);
  }

  // 编辑距离（Levenshtein）：越小越相似
  function editDistance(a, b) {
    const la = a.length, lb = b.length;
    if (!la) return lb;
    if (!lb) return la;
    let prev = new Array(lb + 1);
    for (let j = 0; j <= lb; j++) prev[j] = j;
    for (let i = 1; i <= la; i++) {
      const cur = [i];
      for (let j = 1; j <= lb; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[lb];
  }

  // 模糊匹配：无精准匹配时，用二分前缀快速收敛候选集（前2字符 → 降级首字符），
  // 再按编辑距离找最接近的词。词长差异 > 2 直接跳过。
  function fuzzyMatch(q, max = 20) {
    if (q.length < 2) return [];
    // 候选集：优先前 2 字符前缀（二分 O(log n)），候选不足 30 个时降级为首字符前缀
    let cand = prefixRange(keys, q.slice(0, 2));
    if (cand.length < 30) cand = prefixRange(keys, q[0]);
    const lenLo = Math.max(1, q.length - 2), lenHi = q.length + 2;
    const scored = [];
    for (const w of cand) {
      const lw = w.length;
      if (lw < lenLo || lw > lenHi) continue;
      scored.push({ w, d: editDistance(q, w) });
      if (scored.length > 3000) break; // 防极端：只对前 3000 个长度相近候选算距离
    }
    scored.sort((a, b) => a.d - b.d || a.w.length - b.w.length);
    return scored.slice(0, max);
  }

  // 用 rAF 合并高频输入，保证即时且不阻塞
  let searchRaf = 0;
  function refresh() {
    cancelAnimationFrame(searchRaf);
    searchRaf = requestAnimationFrame(() => {
      const q = $('search').value.trim().toLowerCase();
      if (q) {
        const exact = prefixRange(keys, q);
        if (exact.length) {
          // 精准匹配优先
          filtered = exact;
        } else {
          // 无精准匹配：模糊匹配按近似程度排序（词库大，放 rAF 后继续用微任务避免卡顿）
          filtered = fuzzyMatch(q).map(x => x.w);
        }
      } else {
        filtered = keys;
      }
      page = 0;
      render();
    });
  }

  function render() {
    const list = $('list');
    list.innerHTML = '';
    const start = page * PAGE;
    const slice = filtered.slice(start, start + PAGE);
    if (slice.length === 0) list.innerHTML = '<li>无匹配词条</li>';
    slice.forEach((w, i) => {
      const li = document.createElement('li');
      const preview = toText(DICTS[cur].data[w]).slice(0, 120);
      li.innerHTML = '<div class="w"></div><div class="preview"></div>';
      li.querySelector('.w').textContent = w;
      li.querySelector('.preview').textContent = preview;
      li.onclick = () => showDetail(w);
      list.appendChild(li);
    });
    $('pageInfo').textContent = (start + 1) + ' - ' + (start + slice.length) + ' / ' + filtered.length;
    $('prev').disabled = page <= 0;
    $('next').disabled = start + PAGE >= filtered.length;
  }

  function showDetail(w, base, favorited, cands) {
    const d = DICTS[cur];
    // 重定向：@@@LINK=xxx → 展示目标词条
    const target = d ? resolveRedirect(cur, w) : w;
    let html = (d && d.data) ? (d.data[target] != null ? d.data[target] : d.data[w]) : null;
    // 未导入任何词典时：若有基础词典信息，则不显示"无内容"提示，直接以下方基础词典块作为详情
    const hasBaseInfo = !!(base && (base.phonetic || base.meaning || base.category));
    const fromNote = target !== w ? '<div class="redirect-note">↪ 重定向自「' + w + '」</div>' : '';
    const box = $('detail');
    let body;
    if (html == null) {
      body = hasBaseInfo ? '' : '<div class="raw">（该词条无内容或重定向目标缺失）</div>';
    } else if (/\.html?$/i.test(html) === false && /<[a-z]/i.test(html)) {
      // 含 HTML 标签：注入词典 CSS + 重写资源路径后原样展示
      injectDictCss(cur);
      body = '<div class="collins-html">' + renderDictHtml(html, cur) + '</div>';
    } else {
      body = '<div class="raw">' + toText(html) + '</div>';
    }
    // 基础词典补充信息（形近词等非本词典词条）：保留上述"查不到"提示，在其下方追加基础词典详情
    let baseHtml = '';
    if (base && (base.phonetic || base.meaning || base.category)) {
      let catTags = '';
      if (base.category) {
        const parts = String(base.category).split('/').filter(Boolean);
        if (parts.length > 0) {
          catTags = parts.map(function(p, i) {
            const isLast = i === parts.length - 1;
            return '<span class="base-dict-cat ' + (isLast ? 'base-dict-cat-last' : 'base-dict-cat-base') + '">' + esc(p) + '</span>';
          }).join('');
        }
      }
      baseHtml = '<div class="base-dict">' +
        '<div class="base-dict-title">📖 基础词典</div>' +
        '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;">' +
        (base.phonetic ? '<div class="base-dict-phonetic" style="margin:0;">' + esc(base.phonetic) + '</div>' : '') +
        (catTags ? catTags : '') +
        '</div>' +
        (base.meaning ? '<div class="base-dict-meaning">' + esc(base.meaning) + '</div>' : '') +
        '</div>';
    }
    // 拼写提示：搜索框有输入、且输入词在当前词典无精准释义（含重定向）时，判定为近似匹配，
    // 在单词右侧（detail-head）显示提示；拼写正确则不显示
    let fuzzyHint = '';
    try {
      const q = $('search').value.trim().toLowerCase();
      if (q) {
        const hasExact = DICTS[cur].data[q] != null || DICTS[cur].data[resolveRedirect(cur, q)] != null;
        if (!hasExact) fuzzyHint = '<span class="fuzzy-hint">← 你可能要查的是</span>';
      }
    } catch (e) { /* 忽略 */ }
    box.innerHTML = '<div class="detail-head" title="点击空白处折叠"><h2>' + target + ' <span class="meta">' + ((d && d.name) || (hasBaseInfo ? '基础词典' : '')) + '</span>' + fuzzyHint + '<span class="detail-fav-star' + (favorited ? ' favorited' : '') + '" title="收藏"><span class="favorite-icon">⭐</span></span></h2><span class="collapse-icon" title="折叠当前词条"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></span></div>' + fromNote + body + baseHtml;
    box.style.display = 'block';
    // Collins 词条美化：词性缩写（N-COUNT→n.[C] 等）+ 主词及其词形变体高亮
    beautifyCollins(box, target, cands);
    // 滚动到词条顶部：只滚主窗口（scrollIntoView 会递归滚动词条内部 overflow 容器，导致偏移），
    // 并减去 sticky header 高度，让单词 header 完整露出在顶部
    requestAnimationFrame(() => {
      const headerH = (document.querySelector('header') || { offsetHeight: 0 }).offsetHeight;
      const top = box.getBoundingClientRect().top + window.scrollY - headerH -16;
      window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    });

    // 点击主单词 → 通知父页面搜索该词，显示下拉结果清单；点击空白处折叠
    const headEl = box.querySelector('.detail-head');
    headEl.addEventListener('click', (e) => {
      if (e.target.closest('.collapse-icon')) { // icon 折叠
        e.stopPropagation();
        doCollapseDetail();
        return;
      }
      if (e.target.closest('h2')) {
        // 点击主单词区域 → 通知父页面搜索该词
        if (LOOKUP) {
          e.stopPropagation();
          post({ type: 'word-click', word: target });
        }
        return;
      }
      doCollapseDetail();
    });
    const iconEl = box.querySelector('.collapse-icon');
    iconEl.addEventListener('click', (e) => {
      e.stopPropagation();
      doCollapseDetail();
    });

    // 收藏星标按钮：点击切换收藏状态，通知父页面处理
    const favStar = box.querySelector('.detail-fav-star');
    if (favStar) {
      favStar.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        const isFav = favStar.classList.toggle('favorited');
        favStar.title = isFav ? '取消收藏' : '收藏';
        // 向父页面发送收藏/取消收藏请求
        if (LOOKUP) {
          post({
            type: 'favorite',
            word: target,
            phonetic: (base && base.phonetic) || '',
            meaning: (base && base.meaning) || '',
            favorited: isFav
          });
        }
      });
    }

    // 记录最近查阅：展开超过 1 秒才计入（历史跨词典全局共享）
    const key = 'recentWords';
    let timer = setTimeout(() => {
      try {
        const recent = JSON.parse(localStorage.getItem(key) || '[]');
        // 去重并置顶
        const filtered = recent.filter(x => x !== target);
        filtered.unshift(target);
        // 只保留最近 50 个
        if (filtered.length > 50) filtered.length = 50;
        localStorage.setItem(key, JSON.stringify(filtered));
      } catch (e) { /* 忽略 */ }
    }, 1000);
    // 如果用户在 1 秒内关闭详情，取消记录
    const cleanup = () => { clearTimeout(timer); box.removeEventListener('collapse', cleanup); };
    // 折叠时清除定时器（不记录最近查阅）
    box.querySelector('.detail-head').addEventListener('click', cleanup, { once: true });
  }

  // 折叠详情区，并滚动回列表中的该词
  function doCollapseDetail() {
    const box = $('detail');
    box.style.display = 'none';
    const lw = box.querySelector('.w');
    if (lw) lw.scrollIntoView({ behavior: 'smooth', block: 'center' });
    // 查询模式：通知主页详情已折叠，返回结果列表视图
    if (LOOKUP) post({ type: 'collapsed' });
  }

  function showLoading(msg) {

    $('loading').textContent = msg;
    $('list').style.display = 'none';
    $('pager').style.display = 'none';

  function finishLoad() {
    $('loading').style.display = 'none';
    $('list').style.display = 'block';
    $('pager').style.display = 'flex';
    // file:// 模式下 IndexedDB 不可用，无法缓存词典 → 提示用 serve 模式获得秒开
    try {
      if (location.protocol === 'file:') {
        $('perfHint').style.display = 'block';
        $('perfHint').textContent = '提示：当前为 file:// 模式，浏览器限制无法缓存词典，每次打开都需重新解析。建议运行 node tools/serve.js 后访问 http://localhost:8377/，二次打开可秒开。';
      }
    } catch (e) { /* 忽略 */ }
    renderSelect();
    // 恢复上次选择的词库（若存在且已加载）
    let last = null;
    try { last = localStorage.getItem('browseDictCur'); } catch (e) { /* 忽略 */ }
    if (last && DICTS[last] && DICTS[last].enabled && DICTS[last].data) switchDict(last);
    else if (cur && DICTS[cur] && DICTS[cur].enabled && DICTS[cur].data) {
      // 手动触发 recent words 逻辑（不切换词库时，历史跨词典共享）
      try {
        const key = 'recentWords';
        const recent = JSON.parse(localStorage.getItem(key) || '[]');
        const valid = recent.filter(w => DICTS[cur].data[w] != null);
        if (valid.length) {
          filtered = valid;
          page = 0;
          render();
          return;
        }
      } catch (e) { /* 忽略 */ }
      refresh();
    } else {
      // 当前无有效词库：切到第一个已启用的
      const first = Object.keys(DICTS).find(v => DICTS[v].enabled && DICTS[v].data);
      if (first) switchDict(first);
      else refresh();
    }
  }

  async function init() {
    try {
      // 优先直接加载已保存的词典清单（跳过每次进入的清单扫描/目录弹窗）

      const saved = getSavedMetas();
      if (saved.length) {
        let last = null;
        try { last = localStorage.getItem('browseDictCur'); } catch (e) { /* 忽略 */ }
        showLoading('正在加载最近使用的词典…');
        await applyMetas(saved, last);
        finishLoad();
        return;
      }
      // 首次访问（无持久化清单）：走清单 / 目录扫描
      showLoading('正在加载词典清单…');
      let list = await loadManifest();
      if (!list.length) {

        let files;
        try { files = await scanFolders(); }
        catch (e) { showLoading('扫描已取消: ' + e.message); return; }
        list = files.map(f => ({ name: f.name.replace(/-dict\.js$/i, ''), varName: parseVarName(f.text), text: f.text })).filter(x => x.varName);
      }
      if (!list.length) { showLoading('未检测到任何 *-dict.js 词典文件，可点击「📁 扫描」选择目录'); return; }
