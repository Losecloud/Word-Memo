<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none" role="img" aria-label="英文扑克">
  <!-- 后一张牌：斜置的青绿牌背 -->
  <g transform="rotate(10 92 82)">
    <rect x="42" y="16" width="86" height="122" rx="12" fill="#4a9d9a"/>
    <rect x="52" y="26" width="66" height="102" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <!-- 前一张牌：白色牌面 -->
  <g transform="rotate(-6 80 84)">
    <rect x="34" y="22" width="92" height="126" rx="12" fill="#ffffff" stroke="#cfd6dd" stroke-width="2"/>
    <!-- 左上角标：红色元音 A -->
    <text x="46" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#e5484d">A</text>
    <!-- 三张字母牌，拼成 CAT -->
    <g>
      <rect x="46" y="88" width="22" height="30" rx="5" fill="#f4f7f9" stroke="#c9d1d9"/>
      <text x="57" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1F2937">C</text>
      <rect x="72" y="88" width="22" height="30" rx="5" fill="#fdeceb" stroke="#e5484d"/>
      <text x="83" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#e5484d">A</text>
      <rect x="98" y="88" width="22" height="30" rx="5" fill="#f4f7f9" stroke="#c9d1d9"/>
      <text x="109" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1F2937">T</text>
    </g>
    <!-- 金色闪电：词书炸弹 -->
    <path d="M124 30 L104 68 h14 l-9 32 26-42 h-15 l8-28 z" fill="#F59E0B"/>
  </g>
</svg>
